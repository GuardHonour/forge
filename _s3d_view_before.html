<!doctype html>
<html><head><meta charset="utf-8"><title>S3D sandbox — procedural rigged character</title>
<style>
:root{--bg:#08090b;--cell:#0d0f13;--line:#1b1f26;--ink:#f2f4f7;--mut:#98a1ac;--dim:#5f6873;--volt:#cbf33a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 Archivo,system-ui,sans-serif}
#ui{padding:14px 16px 4px;max-width:1100px}
h1{font-size:16px;margin:0 0 4px;letter-spacing:.02em}
h1 b{color:var(--volt)}
p.sub{color:var(--mut);font-size:12px;margin:2px 0 10px;max-width:80ch}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
button{background:#1a1d23;color:var(--ink);border:1px solid #2a2f38;border-radius:8px;padding:6px 12px;font:700 11px Archivo,system-ui;letter-spacing:.06em;cursor:pointer}
button.on{background:var(--volt);color:#12150a;border-color:var(--volt)}
input[type=range]{width:240px;accent-color:var(--volt)}
#sheet{padding:0 16px 40px}
.line{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.rl{width:104px;flex:0 0 104px;padding-top:6px}
.rl b{font-size:12.5px;display:block}
.rl span{color:var(--dim);font-size:10px;letter-spacing:.05em}
.cv canvas{display:block;border-radius:8px}
.cols{display:flex}
.cols div{font-size:9.5px;color:var(--dim);text-align:center;font-weight:700;letter-spacing:.04em;padding-top:3px}
.hint{color:var(--dim);font-size:11px;margin-top:2px}
</style></head>
<body>
<div id="ui">
  <h1>S3D sandbox — <b>procedural rigged character</b></h1>
  <p class="sub">No Blender, no npm, no dependencies: the mesh, skeleton, skin weights, IK and renderer
  are all generated by <code>_s3d_core.js</code>. Bone lengths come from FORGE's own table, so the 3D
  athlete shares the 2D engine's anatomy.</p>
  <div class="ctl" id="live-ctl" style="display:none">
    <button id="b-play">PAUSE</button>
    <input type="range" id="scrub" min="0" max="1000" value="0">
    <span id="tread" style="font-variant-numeric:tabular-nums;color:var(--mut);min-width:104px"></span>
    <span id="clipbtns"></span>
    <button id="b-sk">SKELETON</button>
    <button id="b-glb">DOWNLOAD .GLB</button>
  </div>
</div>
<div id="sheet"></div>
<script src="_s3d_core.js"></script>
<script src="_s3d_glb.js"></script>
<script>
'use strict';
var Q = new URLSearchParams(location.search);
var ch = S3D.buildCharacter();
var GEO = S3D.packGeometry(ch);
var BONES = ch.sk.order.length;
var NB = Math.max(24, BONES);

var VERT = `#version 300 es
in vec3 aPos; in vec3 aNrm; in vec4 aBone; in vec4 aWgt;
uniform mat4 uBones[${NB}]; uniform mat4 uProj; uniform mat4 uView;
out vec3 vNrm; out vec3 vPos;
void main(){
  mat4 sk = aWgt.x*uBones[int(aBone.x)] + aWgt.y*uBones[int(aBone.y)]
          + aWgt.z*uBones[int(aBone.z)] + aWgt.w*uBones[int(aBone.w)];
  vec4 wp = sk*vec4(aPos,1.0);
  vNrm = mat3(sk)*aNrm; vPos = wp.xyz;
  gl_Position = uProj*uView*wp;
}`;
var FRAG = `#version 300 es
precision highp float;
in vec3 vNrm; in vec3 vPos;
uniform vec3 uEye, uBase, uAccent;
out vec4 o;
void main(){
  vec3 N = normalize(vNrm);
  if(!gl_FrontFacing) N = -N;
  vec3 V = normalize(uEye - vPos);
  vec3 L1 = normalize(vec3(-0.42,0.86,0.50));
  vec3 L2 = normalize(vec3( 0.66,0.20,0.42));
  float d1 = max(dot(N,L1),0.0), d2 = max(dot(N,L2),0.0);
  float rim = pow(1.0 - max(dot(N,V),0.0), 2.6);
  o = vec4(uBase*(0.22 + 0.72*d1 + 0.34*d2) + uAccent*rim*0.30, 1.0);
}`;
var LVERT = `#version 300 es
in vec3 aPos; uniform mat4 uProj, uView;
void main(){ gl_Position = uProj*uView*vec4(aPos,1.0); }`;
var LFRAG = `#version 300 es
precision highp float; uniform vec3 uColor; uniform float uAlpha; out vec4 o;
void main(){ o = vec4(uColor, uAlpha); }`;

function sh(gl, type, src){
  var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function prog(gl, vs, fs){
  var p = gl.createProgram();
  gl.attachShader(p, sh(gl, gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl, gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}

function makeCtx(canvas){
  var gl = canvas.getContext('webgl2', {antialias:true, alpha:false, preserveDrawingBuffer:true});
  if(!gl) throw new Error('no webgl2');
  var P = prog(gl, VERT, FRAG), L = prog(gl, LVERT, LFRAG);
  var A = { pos: gl.getAttribLocation(P,'aPos'), nrm: gl.getAttribLocation(P,'aNrm'),
            bone: gl.getAttribLocation(P,'aBone'), wgt: gl.getAttribLocation(P,'aWgt') };
  var U = { bones: gl.getUniformLocation(P,'uBones'), proj: gl.getUniformLocation(P,'uProj'),
            view: gl.getUniformLocation(P,'uView'), eye: gl.getUniformLocation(P,'uEye'),
            base: gl.getUniformLocation(P,'uBase'), accent: gl.getUniformLocation(P,'uAccent') };
  var LU = { proj: gl.getUniformLocation(L,'uProj'), view: gl.getUniformLocation(L,'uView'),
             color: gl.getUniformLocation(L,'uColor'), alpha: gl.getUniformLocation(L,'uAlpha') };
  var LA = gl.getAttribLocation(L,'aPos');

  function buf(target, data){ var b = gl.createBuffer(); gl.bindBuffer(target,b); gl.bufferData(target,data,gl.STATIC_DRAW); return b; }
  var vPos = buf(gl.ARRAY_BUFFER, GEO.pos), vNrm = buf(gl.ARRAY_BUFFER, GEO.nrm);
  var vBi = buf(gl.ARRAY_BUFFER, GEO.bi), vBw = buf(gl.ARRAY_BUFFER, GEO.bw);
  var iBuf = buf(gl.ELEMENT_ARRAY_BUFFER, GEO.idx);
  // grid + skeleton line buffers
  var grid = [], sg = 22, ext = 110;
  for(var i=-ext;i<=ext;i+=sg){
    grid.push(i,0,-ext, i,0,ext, -ext,0,i, ext,0,i);
  }
  var lGrid = buf(gl.ARRAY_BUFFER, new Float32Array(grid));
  var lDyn = gl.createBuffer();
  return { gl:gl, P:P, L:L, A:A, U:U, LU:LU, LA:LA, vPos:vPos, vNrm:vNrm, vBi:vBi, vBw:vBw, iBuf:iBuf,
           lGrid:lGrid, lDyn:lDyn, gridCount: grid.length/3, boneMats: new Float32Array(NB*16) };
}

function drawCell(ctx, vx, vy, cell, ev, cam, opts){
  var gl = ctx.gl;
  var pad = 3;
  gl.enable(gl.SCISSOR_TEST);
  gl.scissor(vx+pad, vy+pad, cell-2*pad, cell-2*pad);
  gl.clearColor(0.051,0.059,0.075,1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
  gl.viewport(vx+pad, vy+pad, cell-2*pad, cell-2*pad);
  gl.enable(gl.DEPTH_TEST); gl.disable(gl.CULL_FACE);

  ctx.boneMats.set(ev.skin.subarray(0, Math.min(ev.skin.length, NB*16)));

  // floor grid
  gl.useProgram(ctx.L);
  gl.uniformMatrix4fv(ctx.LU.proj,false,new Float32Array(cam.proj));
  gl.uniformMatrix4fv(ctx.LU.view,false,new Float32Array(cam.view));
  gl.uniform3f(ctx.LU.color,0.13,0.15,0.19); gl.uniform1f(ctx.LU.alpha,1);
  gl.bindBuffer(gl.ARRAY_BUFFER, ctx.lGrid);
  gl.enableVertexAttribArray(ctx.LA); gl.vertexAttribPointer(ctx.LA,3,gl.FLOAT,false,0,0);
  gl.drawArrays(gl.LINES,0,ctx.gridCount);

  // figure
  gl.useProgram(ctx.P);
  gl.uniformMatrix4fv(ctx.U.proj,false,new Float32Array(cam.proj));
  gl.uniformMatrix4fv(ctx.U.view,false,new Float32Array(cam.view));
  gl.uniform3fv(ctx.U.eye,new Float32Array(cam.eye));
  gl.uniform3f(ctx.U.base,0.90,0.92,0.94);
  gl.uniform3f(ctx.U.accent,0.796,0.953,0.227);
  gl.uniformMatrix4fv(ctx.U.bones,false,ctx.boneMats);
  gl.bindBuffer(gl.ARRAY_BUFFER, ctx.vPos); gl.enableVertexAttribArray(ctx.A.pos); gl.vertexAttribPointer(ctx.A.pos,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER, ctx.vNrm); gl.enableVertexAttribArray(ctx.A.nrm); gl.vertexAttribPointer(ctx.A.nrm,3,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER, ctx.vBi); gl.enableVertexAttribArray(ctx.A.bone); gl.vertexAttribPointer(ctx.A.bone,4,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ARRAY_BUFFER, ctx.vBw); gl.enableVertexAttribArray(ctx.A.wgt); gl.vertexAttribPointer(ctx.A.wgt,4,gl.FLOAT,false,0,0);
  gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ctx.iBuf);
  gl.drawElements(gl.TRIANGLES, GEO.idx.length, gl.UNSIGNED_INT, 0);

  // skeleton overlay: straight from the evaluated joint positions
  if(opts.skeleton){
    var segs = [];
    ch.sk.boneNames.forEach(function(j){
      var a = ev.fk.p[ch.sk.parent[j]], b = ev.fk.p[j];
      segs.push(a[0],a[1],a[2], b[0],b[1],b[2]);
    });
    gl.useProgram(ctx.L);
    gl.uniform3f(ctx.LU.color,0.796,0.953,0.227); gl.uniform1f(ctx.LU.alpha,0.95);
    gl.bindBuffer(gl.ARRAY_BUFFER, ctx.lDyn);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(segs), gl.DYNAMIC_DRAW);
    gl.enableVertexAttribArray(ctx.LA); gl.vertexAttribPointer(ctx.LA,3,gl.FLOAT,false,0,0);
    gl.drawArrays(gl.LINES,0,segs.length/3);
  }
  gl.disable(gl.SCISSOR_TEST);
}

var TARGET = [0,78,0];
function camera(view, aspect, yaw, pitch, dist){
  yaw = yaw||0; pitch = (pitch===undefined?10:pitch); dist = dist||335;
  if(view==='front')  return { proj:S3D.m4Ortho(80*aspect,80,-800,800), view:S3D.m4LookAt([0,78,500],[0,78,0],[0,1,0]), eye:[0,78,500] };
  if(view==='side')   return { proj:S3D.m4Ortho(80*aspect,80,-800,800), view:S3D.m4LookAt([500,78,0],[0,78,0],[0,1,0]), eye:[500,78,0] };
  if(view==='top')    return { proj:S3D.m4Ortho(80*aspect,80,-800,800), view:S3D.m4LookAt([0,520,0],[0,78,0],[0,0,-1]), eye:[0,520,0] };
  var yr = yaw*Math.PI/180, pr = pitch*Math.PI/180;
  var eye = [TARGET[0]+dist*Math.cos(pr)*Math.sin(yr), TARGET[1]+dist*Math.sin(pr), TARGET[2]+dist*Math.cos(pr)*Math.cos(yr)];
  return { proj:S3D.m4Persp(30,aspect,1,3000), view:S3D.m4LookAt(eye,TARGET,[0,1,0]), eye:eye };
}

function el(tag, cls, txt){ var d=document.createElement(tag); if(cls)d.className=cls; if(txt!==undefined)d.textContent=txt; return d; }

var S3DVIEW = {
  build: function(o){
    var sheet = document.getElementById('sheet');
    sheet.innerHTML = '';
    var cell = o.cell || 170, frames = o.frames || 8;
    var clips = (o.clips || 'twist').split(',');
    var view = o.view || 'persp', yaw = o.yaw === undefined ? 30 : o.yaw;
    var skel = !!o.skeleton;
    var rows = o.rows || clips;
    var t0 = o.t === undefined ? 0.5 : o.t;

    rows.forEach(function(name){
      var clip = S3D.CLIPS[name];
      if(!clip) return;
      var line = el('div','line');
      var rl = el('div','rl');
      rl.appendChild(el('b',null,name));
      rl.appendChild(el('span',null,clip.duration.toFixed(1)+'s'));
      line.appendChild(rl);
      var cv = el('div','cv');
      var canvas = el('canvas');
      canvas.width = cell*frames; canvas.height = cell;
      cv.appendChild(canvas);
      var cols = el('div','cols');
      for(var i=0;i<frames;i++){
        var d = el('div',null, Math.round(clip.duration*1000*i/(frames-1))+'ms');
        d.style.width = cell+'px';
        cols.appendChild(d);
      }
      cv.appendChild(cols);
      line.appendChild(cv);
      sheet.appendChild(line);

      var ctx = makeCtx(canvas);
      for(var f=0;f<frames;f++){
        var t;
        if(o.mode==='turntable') t = clip.duration*t0;
        else t = clip.duration*f/(frames-1);
        var ev = S3D.sample(ch,name,t);
        var yy = (o.mode==='turntable') ? (f/frames*360) : yaw;
        var cam = camera(view, 1, yy, o.pitch===undefined?10:o.pitch, o.dist);
        drawCell(ctx, f*cell, 0, cell, ev, cam, {skeleton:skel});
      }
    });

    if(o.mode==='threeview'){
      var line = el('div','line');
      var rl = el('div','rl'); rl.appendChild(el('b',null,o.clips||'twist'));
      rl.appendChild(el('span',null,'3 ortho views')); line.appendChild(rl);
      var cv = el('div','cv'); var canvas = el('canvas');
      var views = ['front','side','top'];
      canvas.width = cell*views.length; canvas.height = cell;
      cv.appendChild(canvas);
      var cols = el('div','cols');
      views.forEach(function(v){ var d = el('div',null,v.toUpperCase()); d.style.width=cell+'px'; cols.appendChild(d); });
      cv.appendChild(cols); line.appendChild(cv); sheet.appendChild(line);
      var ctx = makeCtx(canvas);
      var clip = S3D.CLIPS[(o.clips||'twist').split(',')[0]];
      views.forEach(function(v,i){
        var ev = S3D.sample(ch, clip.name, clip.duration*t0);
        drawCell(ctx, i*cell, 0, cell, ev, camera(v,1,0,10,430), {skeleton:skel});
      });
    }
    return { w: document.body.scrollWidth, h: document.body.scrollHeight };
  }
};
window.S3DVIEW = S3DVIEW;

/* ---------------- live mode ---------------- */
function live(){
  document.getElementById('live-ctl').style.display = 'flex';
  document.getElementById('ui').firstElementChild.insertAdjacentHTML('afterend',
    '<p class="sub hint">Drag to orbit, wheel to zoom. Scrub the bar to move through the clip; SKELETON overlays the solved joints.</p>');
  var sheet = document.getElementById('sheet');
  var line = el('div','line'); line.appendChild(el('div','rl'));
  var cv = el('div','cv'); var canvas = el('canvas');
  var cell = Math.min(560, window.innerWidth-180);
  canvas.width = cell; canvas.height = cell;
  cv.appendChild(canvas); line.appendChild(cv); sheet.appendChild(line);
  var ctx = makeCtx(canvas);

  var st = { clip: (Q.get('clip')||'twist'), t: 0, playing: true, yaw: 26, pitch: 10, dist: 430, skel: false, last: performance.now() };
  var btns = document.getElementById('clipbtns');
  Object.keys(S3D.CLIPS).forEach(function(name){
    var b = el('button', null, name.toUpperCase());
    if(name===st.clip) b.className='on';
    b.onclick = function(){ st.clip=name; st.t=0; Array.prototype.forEach.call(btns.children,function(c){c.className='';}); b.className='on'; };
    btns.appendChild(b);
  });
  var pp = document.getElementById('b-play');
  pp.onclick = function(){ st.playing=!st.playing; pp.textContent = st.playing?'PAUSE':'PLAY'; };
  var skb = document.getElementById('b-sk');
  skb.onclick = function(){ st.skel=!st.skel; skb.className = st.skel?'on':''; };
  var scrub = document.getElementById('scrub');
  scrub.addEventListener('input', function(){ st.playing=false; pp.textContent='PLAY'; st.t = +this.value/1000 * S3D.CLIPS[st.clip].duration; });
  var drag = null;
  canvas.addEventListener('mousedown', function(e){ drag={x:e.clientX,y:e.clientY}; });
  window.addEventListener('mouseup', function(){ drag=null; });
  window.addEventListener('mousemove', function(e){
    if(!drag) return;
    st.yaw += (e.clientX-drag.x)*0.5; st.pitch = Math.max(-70, Math.min(80, st.pitch + (e.clientY-drag.y)*0.3));
    drag = {x:e.clientX,y:e.clientY};
  });
  canvas.addEventListener('wheel', function(e){ e.preventDefault(); st.dist = Math.max(160, Math.min(1000, st.dist + e.deltaY*0.5)); }, {passive:false});

  var glbb = document.getElementById('b-glb');
  glbb.onclick = function(){
    glbb.textContent = 'BUILDING\u2026';
    setTimeout(function(){
      try {
        var out = window.S3DGLB.buildGLB({ character: ch });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([out.bytes], { type: 'model/gltf-binary' }));
        a.download = 'forge-3d-character.glb';
        a.click();
        glbb.textContent = 'DOWNLOAD .GLB (' + (out.stats.bytes/1048576).toFixed(1) + ' MB)';
      } catch (e) { glbb.textContent = 'EXPORT FAILED'; }
    }, 30);
  };

  function frame(now){
    var dur = S3D.CLIPS[st.clip].duration;
    if(st.playing) st.t = (st.t + (now-st.last)/1000) % dur;
    st.last = now;
    document.getElementById('tread').textContent = Math.round(st.t*1000)+'ms / '+Math.round(dur*1000)+'ms';
    scrub.value = Math.round(st.t/dur*1000);
    var ev = S3D.sample(ch, st.clip, st.t);
    var gl = ctx.gl;
    gl.disable(gl.SCISSOR_TEST);
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.clearColor(0.051,0.059,0.075,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    drawCell(ctx, 0, 0, cell, ev, camera('persp', 1, st.yaw, st.pitch, st.dist), {skeleton:st.skel});
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__LIVE_READY = true;
}

var MODE = Q.get('mode') || 'live';
if(MODE === 'live') live();
else {
  window.__SHEET = S3DVIEW.build({
    mode: MODE,
    clips: Q.get('clips') || Q.get('clip') || 'twist',
    view: Q.get('view') || 'persp',
    yaw: Q.get('yaw') === null ? 30 : +Q.get('yaw'),
    pitch: Q.get('pitch') === null ? 10 : +Q.get('pitch'),
    dist: Q.get('dist') === null ? 430 : +Q.get('dist'),
    frames: Q.get('frames') ? +Q.get('frames') : 8,
    cell: Q.get('cell') ? +Q.get('cell') : 170,
    t: Q.get('t') === null ? 0.5 : +Q.get('t'),
    skeleton: Q.get('skeleton') === '1'
  });
}
</script>
</body></html>
