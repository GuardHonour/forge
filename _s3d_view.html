<!doctype html>
<html><head><meta charset="utf-8"><title>S3D sandbox — procedural rigged character</title>
<style>
:root{--bg:#08090b;--cell:#0d0f13;--line:#1b1f26;--ink:#f2f4f7;--mut:#98a1ac;--dim:#5f6873;--volt:#cbf33a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 Archivo,system-ui,sans-serif}
#ui{padding:14px 16px 4px;max-width:1100px}
h1{font-size:16px;margin:0 0 4px;letter-spacing:.02em}
h1 b{color:var(--volt)}
p.sub{color:var(--mut);font-size:12px;margin:2px 0 10px;max-width:80ch}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
button{background:#1a1d23;color:var(--ink);border:1px solid #2a2f38;border-radius:8px;padding:6px 12px;font:700 11px Archivo,system-ui;letter-spacing:.06em;cursor:pointer}
button.on{background:var(--volt);color:#12150a;border-color:var(--volt)}
input[type=range]{width:240px;accent-color:var(--volt)}
#sheet{padding:0 16px 40px}
.line{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.rl{width:104px;flex:0 0 104px;padding-top:6px}
.rl b{font-size:12.5px;display:block}
.rl span{color:var(--dim);font-size:10px;letter-spacing:.05em}
.cv canvas{display:block;border-radius:8px}
.cols{display:flex}
.cols div{font-size:9.5px;color:var(--dim);text-align:center;font-weight:700;letter-spacing:.04em;padding-top:3px}
.hint{color:var(--dim);font-size:11px;margin-top:2px}
</style></head>
<body>
<div id="ui">
  <h1>S3D sandbox — <b>procedural rigged character</b></h1>
  <p class="sub">No Blender, no npm, no dependencies: the mesh, skeleton, skin weights, IK and renderer
  are all generated by <code>_s3d_core.js</code>. Bone lengths come from FORGE's own table, so the 3D
  athlete shares the 2D engine's anatomy.</p>
  <div class="ctl" id="live-ctl" style="display:none">
    <button id="b-play">PAUSE</button>
    <input type="range" id="scrub" min="0" max="1000" value="0">
    <span id="tread" style="font-variant-numeric:tabular-nums;color:var(--mut);min-width:104px"></span>
    <span id="clipbtns"></span>
    <button id="b-sk">SKELETON</button>
    <button id="b-glb">DOWNLOAD .GLB</button>
  </div>
</div>
<div id="sheet"></div>
<script src="_s3d_core.js"></script>
<script src="_s3d_glb.js"></script>
<script src="_s3d_render.js"></script>
<script>
'use strict';
var Q = new URLSearchParams(location.search);
var ch = S3D.buildCharacter();
var GEO = S3D.packGeometry(ch);
/* GLSL, programs, camera and the draw path live in _s3d_render.js — one renderer, shared with
   the in-app 3D view, so there is no second copy to drift. */
var R = window.S3D_RENDER;

function el(tag, cls, txt){ var d=document.createElement(tag); if(cls)d.className=cls; if(txt!==undefined)d.textContent=txt; return d; }

var S3DVIEW = {
  build: function(o){
    var sheet = document.getElementById('sheet');
    sheet.innerHTML = '';
    var cell = o.cell || 170, frames = o.frames || 8;
    var clips = (o.clips || 'twist').split(',');
    var view = o.view || 'persp', yaw = o.yaw === undefined ? 30 : o.yaw;
    var skel = !!o.skeleton;
    var rows = o.rows || clips;
    var t0 = o.t === undefined ? 0.5 : o.t;

    rows.forEach(function(name){
      var clip = S3D.CLIPS[name];
      if(!clip) return;
      var line = el('div','line');
      var rl = el('div','rl');
      rl.appendChild(el('b',null,name));
      rl.appendChild(el('span',null,clip.duration.toFixed(1)+'s'));
      line.appendChild(rl);
      var cv = el('div','cv');
      var canvas = el('canvas');
      canvas.width = cell*frames; canvas.height = cell;
      cv.appendChild(canvas);
      var cols = el('div','cols');
      for(var i=0;i<frames;i++){
        var d = el('div',null, Math.round(clip.duration*1000*i/(frames-1))+'ms');
        d.style.width = cell+'px';
        cols.appendChild(d);
      }
      cv.appendChild(cols);
      line.appendChild(cv);
      sheet.appendChild(line);

      var ctx = R.makeCtx(canvas, ch, GEO);
      for(var f=0;f<frames;f++){
        var t;
        if(o.mode==='turntable') t = clip.duration*t0;
        else t = clip.duration*f/(frames-1);
        var ev = S3D.sample(ch,name,t);
        var yy = (o.mode==='turntable') ? (f/frames*360) : yaw;
        var cam = R.camera(view, 1, yy, o.pitch===undefined?10:o.pitch, o.dist);
        R.drawCell(ctx, f*cell, 0, cell, ev, cam, {skeleton:skel});
      }
    });

    if(o.mode==='threeview'){
      var line = el('div','line');
      var rl = el('div','rl'); rl.appendChild(el('b',null,o.clips||'twist'));
      rl.appendChild(el('span',null,'3 ortho views')); line.appendChild(rl);
      var cv = el('div','cv'); var canvas = el('canvas');
      var views = ['front','side','top'];
      canvas.width = cell*views.length; canvas.height = cell;
      cv.appendChild(canvas);
      var cols = el('div','cols');
      views.forEach(function(v){ var d = el('div',null,v.toUpperCase()); d.style.width=cell+'px'; cols.appendChild(d); });
      cv.appendChild(cols); line.appendChild(cv); sheet.appendChild(line);
      var ctx = R.makeCtx(canvas, ch, GEO);
      var clip = S3D.CLIPS[(o.clips||'twist').split(',')[0]];
      views.forEach(function(v,i){
        var ev = S3D.sample(ch, clip.name, clip.duration*t0);
        R.drawCell(ctx, i*cell, 0, cell, ev, R.camera(v,1,0,10,430), {skeleton:skel});
      });
    }
    return { w: document.body.scrollWidth, h: document.body.scrollHeight };
  }
};
window.S3DVIEW = S3DVIEW;

/* ---------------- live mode ---------------- */
function live(){
  document.getElementById('live-ctl').style.display = 'flex';
  document.getElementById('ui').firstElementChild.insertAdjacentHTML('afterend',
    '<p class="sub hint">Drag to orbit, wheel to zoom. Scrub the bar to move through the clip; SKELETON overlays the solved joints.</p>');
  var sheet = document.getElementById('sheet');
  var line = el('div','line'); line.appendChild(el('div','rl'));
  var cv = el('div','cv'); var canvas = el('canvas');
  var cell = Math.min(560, window.innerWidth-180);
  canvas.width = cell; canvas.height = cell;
  cv.appendChild(canvas); line.appendChild(cv); sheet.appendChild(line);
  var ctx = R.makeCtx(canvas, ch, GEO);

  var st = { clip: (Q.get('clip')||'twist'), t: 0, playing: true, yaw: 26, pitch: 10, dist: 430, skel: false, last: performance.now() };
  var btns = document.getElementById('clipbtns');
  Object.keys(S3D.CLIPS).forEach(function(name){
    var b = el('button', null, name.toUpperCase());
    if(name===st.clip) b.className='on';
    b.onclick = function(){ st.clip=name; st.t=0; Array.prototype.forEach.call(btns.children,function(c){c.className='';}); b.className='on'; };
    btns.appendChild(b);
  });
  var pp = document.getElementById('b-play');
  pp.onclick = function(){ st.playing=!st.playing; pp.textContent = st.playing?'PAUSE':'PLAY'; };
  var skb = document.getElementById('b-sk');
  skb.onclick = function(){ st.skel=!st.skel; skb.className = st.skel?'on':''; };
  var scrub = document.getElementById('scrub');
  scrub.addEventListener('input', function(){ st.playing=false; pp.textContent='PLAY'; st.t = +this.value/1000 * S3D.CLIPS[st.clip].duration; });
  var drag = null;
  canvas.addEventListener('mousedown', function(e){ drag={x:e.clientX,y:e.clientY}; });
  window.addEventListener('mouseup', function(){ drag=null; });
  window.addEventListener('mousemove', function(e){
    if(!drag) return;
    st.yaw += (e.clientX-drag.x)*0.5; st.pitch = Math.max(-70, Math.min(80, st.pitch + (e.clientY-drag.y)*0.3));
    drag = {x:e.clientX,y:e.clientY};
  });
  canvas.addEventListener('wheel', function(e){ e.preventDefault(); st.dist = Math.max(160, Math.min(1000, st.dist + e.deltaY*0.5)); }, {passive:false});

  var glbb = document.getElementById('b-glb');
  glbb.onclick = function(){
    glbb.textContent = 'BUILDING\u2026';
    setTimeout(function(){
      try {
        var out = window.S3DGLB.buildGLB({ character: ch });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob([out.bytes], { type: 'model/gltf-binary' }));
        a.download = 'forge-3d-character.glb';
        a.click();
        glbb.textContent = 'DOWNLOAD .GLB (' + (out.stats.bytes/1048576).toFixed(1) + ' MB)';
      } catch (e) { glbb.textContent = 'EXPORT FAILED'; }
    }, 30);
  };

  function frame(now){
    var dur = S3D.CLIPS[st.clip].duration;
    if(st.playing) st.t = (st.t + (now-st.last)/1000) % dur;
    st.last = now;
    document.getElementById('tread').textContent = Math.round(st.t*1000)+'ms / '+Math.round(dur*1000)+'ms';
    scrub.value = Math.round(st.t/dur*1000);
    var ev = S3D.sample(ch, st.clip, st.t);
    var gl = ctx.gl;
    gl.disable(gl.SCISSOR_TEST);
    gl.viewport(0,0,canvas.width,canvas.height);
    gl.clearColor(0.051,0.059,0.075,1); gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
    /* drawCell, not draw: the live canvas is one padded cell, whose 3 px border ring lies
       outside the scissored viewport and therefore has to be cleared here. Calling draw would
       fill the whole canvas and render the figure 6 px larger — a different picture. */
    R.drawCell(ctx, 0, 0, cell, ev, R.camera('persp', 1, st.yaw, st.pitch, st.dist), {skeleton:st.skel});
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  window.__LIVE_READY = true;
}

var MODE = Q.get('mode') || 'live';
if(MODE === 'live') live();
else {
  window.__SHEET = S3DVIEW.build({
    mode: MODE,
    clips: Q.get('clips') || Q.get('clip') || 'twist',
    view: Q.get('view') || 'persp',
    yaw: Q.get('yaw') === null ? 30 : +Q.get('yaw'),
    pitch: Q.get('pitch') === null ? 10 : +Q.get('pitch'),
    dist: Q.get('dist') === null ? 430 : +Q.get('dist'),
    frames: Q.get('frames') ? +Q.get('frames') : 8,
    cell: Q.get('cell') ? +Q.get('cell') : 170,
    t: Q.get('t') === null ? 0.5 : +Q.get('t'),
    skeleton: Q.get('skeleton') === '1'
  });
}
</script>
</body></html>
