/* ================= FX ================= */
function toast(html,cls){
  const host=$('#toasts');
  /* replace any existing toast instead of stacking a ladder */
  host.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div');t.className='toast'+(cls?' '+cls:'');t.innerHTML=html;host.appendChild(t);requestAnimationFrame(()=>t.classList.add('on'));setTimeout(()=>{t.classList.remove('on');setTimeout(()=>t.remove(),300)},2200)}
function boom(){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=[accHex(),EXBY?'#ff6b4a':'#ff6b4a','#f2f4f8','#9be15d'];
  const P=[];for(let i=0;i<90;i++)P.push({x:innerWidth/2+(Math.random()-.5)*220,y:innerHeight*.34,vx:(Math.random()-.5)*10,vy:-Math.random()*12-4,g:.38,s:Math.random()*7+4,c:cols[i%4],a:1,rot:Math.random()*6});
  let t=0;(function f(){t++;x.clearRect(0,0,c.width,c.height);let al=false;
    for(const p of P){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.a-=.012;
      if(p.a>0){al=true;x.globalAlpha=p.a;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.rot+t*.06);x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.62);x.restore()}}
    if(al&&t<150)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}
function restStart(sec,label){T.total=Math.max(5,sec);T.end=Date.now()+T.total*1000;T.label=label||'REST';if(T.int)clearInterval(T.int);T.int=setInterval(tickT,250);tickT(true)}
function tickT(first){
  const p=$('#pill');if(!T.end){restStop(true);return}
  /* wall-clock based: immune to interval drift, runs at real speed */
  T.left=Math.max(0,Math.round((T.end-Date.now())/1000));
  p.classList.add('on');p.classList.toggle('tick',!!first);
  $('#pill-time').textContent=mmss(T.left);
  $('#pill-label').textContent=T.left<=5?'GO':T.label;
  $('#pill-fg').style.strokeDashoffset=(100.5*(1-T.left/Math.max(1,T.total))).toFixed(1);
  $('.pill-ring').classList.toggle('go',T.left<=5);
  if(T.left<=0){T.end=null;restStop()}
}
function restStop(done){
  if(T.int){clearInterval(T.int);T.int=null}
  $('#pill').classList.remove('on');
  if(done){try{navigator.vibrate&&navigator.vibrate([80,60,80])}catch(e){};toast('Rest over · next set')}
}

/* The effort strip reports the LIVE readings and nothing more: today's weight is
   already on the bar, so what this session's effort changes is the NEXT one. The
   line under the recommendation is where that story belongs — and it is written

function rirHint(en){
  const v=entryRir(en);
  if(v===null)return 'tap a set · 0–5 reps<br>left in reserve · target '+prof().rir;
  const lg=loggedRir(en),tot=Math.max(1,volSets(en.sets).length);
  return 'hardest set '+v+' in reserve<br>'+(lg?lg+' of '+tot+' sets logged':'effort logged');
}
/* What the logged effort DID to the load now on the bar — in the engine's own
   words, including when the honest answer is "nothing yet". Without this the
   effort buttons look inert, which is exactly how they read before. */
function rirNote(nl){
  if(!nl||!nl.trust)return '';
  const why=nl.trust.why||'';
  if(nl.trust.ok)return '';                       /* the note already says it */
  if(why==='no effort logged')
    return 'Reps alone set this load. Log reps in reserve per set and the next load can answer how hard the sets actually felt.';
  if(why==='effort was exactly on target')
    return 'Last session you hit your target of '+prof().rir+' in reserve, so the rep range alone set this load.';
  if(why==='you overrode this one')return '';
  const r=(typeof nl.rir==='number')?nl.rir:null;
  if(r===null)return '';
  return 'Hardest set last time: '+r+' in reserve. A single reading sits inside its own error, so reps decided this load — repeat the signal and it will move the weight.';
}
function vSession(){

  const dn=sess.entries.reduce((a,en)=>a+en.sets.filter(s=>s.done&&countsVol(s)).length,0);

      +'<span class="rxpill rxtgt" title="Prescribed rep range for '+esc(ex.n)+'">'
        +'<b>'+ex.def.s+'×'+ex.def.min+'–'+ex.def.max+'</b> '+repLower(ex)+'</span>'

/* holds: press-and-repeat, orphan-proof.
   Every repeat tick checks the button is still connected to the document;
   a rerender that detaches it kills the loop within one tick (95ms). */
function wireHolds(){
  document.querySelectorAll('[data-hold]').forEach(b=>{
    let iv=null,to=null;
    const stop=()=>{if(to){clearTimeout(to);to=null}if(iv){clearInterval(iv);iv=null}};
    const fire=()=>{try{(Function('return '+b.dataset.hold))()}catch(e){}};
    b._holdStop&&b._holdStop();
    let moved=false;
    const down=e=>{
      if(e.button!==undefined&&e.button!==0)return;
      moved=false;
      e.preventDefault();
      stop();fire();
      to=setTimeout(()=>{
        iv=setInterval(()=>{
          if(!b.isConnected){stop();return}
          fire();
        },95);
      },420);
    };
    const move=e=>{ if(Math.abs(e.clientX-(down._x||e.clientX))>12||Math.abs(e.clientY-(down._y||e.clientY))>12) moved=true; };
    const origDown=down;
    const down2=e=>{ down._x=e.clientX; down._y=e.clientY; origDown(e); };
    b.addEventListener('pointerdown',down2);
    b.addEventListener('pointermove',move);
    ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,stop));
    /* pointerleave removed: tiny finger drift on touch was killing taps instantly.
       Instead: on pointerup, if the finger drifted off the button, just stop (no extra fire). */
    b.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse') stop(); });
    b._holdStop=stop;
  });
  document.querySelectorAll('.chk').forEach(c=>c.onclick=()=>G.checkSet(+c.dataset.i,+c.dataset.k));
}

/* ================= CONSISTENCY CALENDAR =================
   A grid of coloured squares is decoration unless it answers the two questions a
   lifter actually has: WHEN did I last train, and WHAT happened on a given day.
   So: one column per calendar week (Monday at the top, built from mondayOf — the
   same week engine History divides sessions by, so a column here is exactly a
   "THIS WEEK / LAST WEEK" block there), a row per weekday, a ring on today, a
   hollow square for days that have not happened yet, a named week axis, and a
   tap that reports the day back. Days count SESSIONS; shade is that day's
   tonnage (working sets only — volSets, the shared definition). */
function heatCard(){
  const today=todayISO(),vol={},cnt={};
  S.hist.forEach(s=>{vol[s.date]=(vol[s.date]||0)+sessVol(s);cnt[s.date]=(cnt[s.date]||0)+1});
  /* a future-dated record (clock skew, a hand-edited backup) is not "the last
     session" — only days that have actually happened can be */
  const days=Object.keys(vol).filter(d=>d<=today).sort();
  const last=days.length?days[days.length-1]:null;
  const lastSess=last?S.hist.filter(s=>s.date===last).slice(-1)[0]:null;
  const last7=S.hist.filter(s=>s.date>=addDays(today,-6)&&s.date<=today).length;
  const start=mondayOf(addDays(today,-49));
  const mx=Math.max(1,...Object.values(vol));
  let grid='';
  for(let dow=0;dow<7;dow++){
    grid+='<span class="hdow" aria-hidden="true">'+'MTWTFSS'[dow]+'</span>';
    for(let w=0;w<8;w++){
      const d=addDays(start,w*7+dow),v=vol[d]||0,fut=d>today,now=d===today;
      const what=fut?'not yet'                /* "missed" and "has not happened" must not look alike */
        :v?(cnt[d]+(cnt[d]>1?' sessions':' session')+' · '+loc(v)+' '+wl())
        :'no session';
      const lbl=dFull(d)+' · '+what;
      grid+='<div class="hcell'+(fut?' hfut':'')+(now?' htoday':'')+'" data-d="'+d+'" title="'+esc(lbl)+'" aria-label="'+esc(lbl)+'"'
        +(fut?'':' role="button" tabindex="-1" onclick="G.heatTap(\''+d+'\')"')
        +(v?' style="background:var(--volt);opacity:'+(0.3+0.7*Math.sqrt(v/mx)).toFixed(2)+'"':'')+'></div>';
    }
  }
  /* week axis: that week's Monday, with the month named wherever it changes */
  const axis=['<span></span>'];let prevM=null;
  for(let w=0;w<8;w++){
    const mon=addDays(start,w*7),dt=new Date(mon+'T00:00:00'),mo=dt.getMonth();
    axis.push('<span class="hwl'+(w===7?' now':'')+'">'+(w===7?'NOW':(prevM===null||mo!==prevM?dShort(mon):''+dt.getDate()))+'</span>');
    prevM=mo;
  }
  grid+=axis.join('');
  return '<div class="hsum">'
    +'<div class="hstat"><div class="hbig">'+(last?'Last session '+ago(last):'No sessions yet')+'</div>'
      +'<div class="hsub">'+(last?esc(dFull(last))+(lastSess?' · '+esc(lastSess.name):'')+(lastSess&&lastSess.prCount?' · '+lastSess.prCount+' PR':''):'Log one and it lands here')+'</div></div>'
    +'<div class="hstat"><div class="hbig">'+last7+'</div><div class="hsub">in the last 7 days</div></div></div>'
    +'<div class="heat">'+grid+'</div>'
    +'<div class="hlegend"><span>no session</span><i class="hs0"></i><i style="opacity:.35"></i><i style="opacity:.65"></i><i></i><span>heaviest day</span></div>'
    +'<div class="hnote">Tap any day for what you did on it. A dashed square is a day still to come.</div>';
}

/* ================= BACKUP & RESTORE ================= */
/* localStorage is the only copy of the log, so a backup the app cannot read
   back is not a backup. Everything here is additive: a merge never removes a
   session, and every import snapshots the current data first so a wrong choice
   is recoverable rather than fatal. */
const BAK_META='_forge';
let __imp=null;   /* parsed backup awaiting a merge/replace decision */
const BAK_KEEP=['unit','theme','accent','split','dayEx','hist','prog','profile','over','pain','bwLog','lastExport'];
function parseBackup(text){
  let o;try{o=JSON.parse(String(text==null?'':text).trim())}catch(e){return{ok:false,err:'that is not valid JSON'}}
  if(!o||typeof o!=='object'||Array.isArray(o))return{ok:false,err:'expected a JSON object'};
  if(!Array.isArray(o.hist))return{ok:false,err:'no session history in this file'};
  const bad=o.hist.filter(s=>!s||typeof s!=='object'||!Array.isArray(s.entries));
  if(bad.length)return{ok:false,err:bad.length+' of '+o.hist.length+' sessions are malformed'};
  const mine={};(S.hist||[]).forEach(s=>{if(s&&s.id)mine[s.id]=1});
  const dates=o.hist.map(s=>s.date).filter(d=>typeof d==='string'&&d.length>=8).sort();
  const meta=o[BAK_META]||{};
  return{ok:true,data:o,n:o.hist.length,
    sets:o.hist.reduce((a,s)=>a+s.entries.reduce((x,e)=>x+((e.sets&&e.sets.length)||0),0),0),
    from:dates[0]||null,to:dates[dates.length-1]||null,
    dupes:o.hist.filter(s=>s.id&&mine[s.id]).length,
    build:meta.build||null,exported:meta.exported||null};
}
/* copy only keys we know, so a hand-edited or foreign file cannot inject junk */
function adoptBackup(d){
  const out={v:2};
  BAK_KEEP.forEach(k=>{if(d[k]!==undefined)out[k]=d[k]});
  out.unit=out.unit||S.unit;out.theme=out.theme||S.theme;out.accent=out.accent||S.accent;
  out.split=out.split||S.split;
  out.hist=Array.isArray(out.hist)?out.hist:[];
  out.dayEx=(out.dayEx&&typeof out.dayEx==='object')?out.dayEx:{};
  return out;
}
function sortHist(){S.hist.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(String(a.id)<String(b.id)?-1:1));return S.hist}
function hasPreImport(){try{return !!localStorage.getItem(KEY+'_pre_import')}catch(e){return false}}
function backupState(){
  const n=(S.hist||[]).length,last=S.lastExport||null;
  let days=null;
  if(last){const t=Date.parse(last+'T00:00:00Z'),now=Date.parse(todayISO()+'T00:00:00Z');if(!isNaN(t)&&!isNaN(now))days=Math.max(0,Math.round((now-t)/864e5))}
  return {n:n,last:last,days:days,never:!last,due:n>=5&&(!last||days>=14)};
}
function backupLine(){
  const b=backupState();
  if(!b.n)return 'Nothing logged yet — nothing to back up.';
  if(b.never)return b.n+' sessions, never backed up.';
  return b.n+' sessions · last backup '+(b.days===0?'today':b.days===1?'yesterday':b.days+' days ago')+'.';
}
function backupCard(){
  const b=backupState();
  if(!b.due)return'';
  return '<div class="sect"><div class="sect-h"><span class="sect-t">Keep your log safe</span><span class="sect-s">'

   +'All '+b.n+' sessions live only in this browser. Clearing site data, switching phones or using a private window loses them for good — '
   +'a downloaded file is the only copy that survives.</div>'

}

/* ================= SAVED-SESSION EDITING ================= */
/* A mis-typed load used to be permanent: the only way out was deleting the whole
   session and losing every good set with it. Editing re-derives the numbers that
   depend on the log (PR count) so the Coach never reads a stale claim. */
let __edit=null;
/* Edits happen on a COPY. Nothing touches the log until Save, so Cancel is free
   and a refused save (every exercise removed) cannot leave an empty shell behind. */
function curEditSession(){return __edit?__edit.work:null}
/* Re-derives the claims a record makes about itself after an edit: the PR count,
   and the exercise-level effort summary — which is only a compatibility mirror of
   the per-set readings, so an edit that changes them must refresh it rather than
   leave the two disagreeing. */
function recountSession(s){
  let n=0;
  (s.entries||[]).forEach(en=>{
    const prev=prevSum(en.id,s.date);
    if(prev&&prev.v>0&&entryVol(en)>prev.v)n++;
    const r=entryRir(en);
    if(r!==null)en.rir=r;else delete en.rir;
  });
  s.prCount=n;
  return n;
}
function sessionEditHTML(){
  const s=curEditSession();
  if(!s)return '<div class="grab"></div><h2>Session gone</h2>';

  if(!s.entries.length){

  }
  s.entries.forEach((en,ei)=>{
    const ex=EXBY[en.id]||{n:en.id,bw:false,inc:2.5};
    const wk=volSets(en.sets),wu=warmCount(en.sets);
    h+='<div class="ecard"><div class="ehead"><span class="ename">'+esc(ex.n)+'</span>'

      +'<button class="exdel" onclick="G.editDelEntry('+ei+')" aria-label="Remove '+esc(ex.n)+'">×</button></div>';
    en.sets.forEach((st,si)=>{
      const kd=kindOf(st);
      /* effort is editable too: the log is yours to correct, and an effort value
         only an in-session tap could ever write would be a one-way door */
      const rv=(typeof st.rir==='number')?(''+st.rir):((typeof en.rir==='number')?'·':'–');
      h+='<div class="erow">'
        +'<span class="eidx">'+(si+1)+'</span>'
        +(ex.bw
          ?'<span class="eval">BW</span>'

/* ================= BODYWEIGHT ================= */
/* Bodyweight is stored in kg — the app's canonical unit — and converted only for
   display. A single scalar could not answer "am I gaining?", so the series is the
   primary record and profile.bw is kept as the current value for compatibility. */
function bwSorted(){return (S.bwLog||[]).slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}
function bwLatest(){const l=bwSorted();return l.length?l[l.length-1].kg:(prof().bw==null?null:prof().bw)}
function bwSeries(n){const l=bwSorted();return n?l.slice(-n):l}
function bwAt(date){
  const l=bwSorted();let v=null;
  l.forEach(e=>{if(e.date<=date)v=e.kg});
  return v==null?(prof().bw==null?null:prof().bw):v;
}
/* returns the stored kg, or null when the value was not usable */
function logBw(kg,date){
  const d=date||todayISO();
  if(typeof kg!=='number'||!isFinite(kg)||kg<=0)return null;
  /* 0.1 kg, NOT r125: a body is not a barbell, and rounding to the 1.25 kg
     plate increment silently rewrote 79 kg as 78.75. */
  const v=Math.round(kg*10)/10;
  if(!Array.isArray(S.bwLog))S.bwLog=[];
  const ex=S.bwLog.find(x=>x&&x.date===d);
  if(ex)ex.kg=v;else S.bwLog.push({date:d,kg:v});
  S.bwLog.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  prof().bw=v;
  return v;
}
function bwTrend(days){
  const s=bwSeries().filter(e=>e.date>=addDays(todayISO(),-(days||28)));
  if(s.length<2)return null;
  const first=s[0].kg,last=s[s.length-1].kg;
  const wk=(Date.parse(s[s.length-1].date)-Date.parse(s[0].date))/6048e5;
  return{n:s.length,first:first,last:last,delta:last-first,
    perWeek:wk>0.2?(last-first)/wk:null,from:s[0].date,to:s[s.length-1].date};
}
/* Deliberately scales to the DATA range, not to zero: on a 0-based axis a real
   2 kg change is invisible. The axis labels carry the true values, and the
   caption states the span, so a tight range cannot masquerade as a big move. */
function svgBw(seq,h){
  h=h||150;const W=560,pl=48,pr=14,pt=16,pb=24,iw=W-pl-pr,ih=h-pt-pb;
  if(!seq||seq.length<2)return '<div class="empty">Log your bodyweight on two different days to see a trend</div>';
  const vs=seq.map(p=>p.y);
  let lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs);
  if(hi-lo<1){const c=(hi+lo)/2;lo=c-0.5;hi=c+0.5}   /* never dress noise up as a trend */
  const pad=(hi-lo)*0.15;lo-=pad;hi+=pad;
  const X=i=>pl+(iw/(seq.length-1))*i;
  const Y=v=>pt+ih-((v-lo)/(hi-lo))*ih;
  let s='<svg viewBox="0 0 '+W+' '+h+'" class="chart" role="img" aria-label="Bodyweight over time">';
  [[hi,'HAVE'],[lo,'NOW']];
  s+='<line class="gridl" x1="'+pl+'" y1="'+Y(hi).toFixed(1)+'" x2="'+(W-pr)+'" y2="'+Y(hi).toFixed(1)+'"/>'
   +'<text class="axl" x="'+(pl-6)+'" y="'+(Y(hi)+3).toFixed(1)+'" text-anchor="end">'+fw(hi)+'</text>'
   +'<line class="gridl" x1="'+pl+'" y1="'+Y(lo).toFixed(1)+'" x2="'+(W-pr)+'" y2="'+Y(lo).toFixed(1)+'"/>'
   +'<text class="axl" x="'+(pl-6)+'" y="'+(Y(lo)+3).toFixed(1)+'" text-anchor="end">'+fw(lo)+'</text>';
  s+='<polyline class="linereal" points="'+seq.map((p,i)=>X(i).toFixed(1)+','+Y(p.y).toFixed(1)).join(' ')+'"/>';
  seq.forEach((p,i)=>{s+='<circle class="'+((i===seq.length-1)?'dot-last':'dot')+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="'+(i===seq.length-1?4.5:3)+'"/>'});
  s+='<text class="axl" x="'+pl+'" y="'+(h-6)+'" text-anchor="start">'+dShort(seq[0].d)+'</text>'
   +'<text class="axl" x="'+(W-pr)+'" y="'+(h-6)+'" text-anchor="end">'+dShort(seq[seq.length-1].d)+'</text>';
  s+='</svg>';
  return s;
}
function bwSection(){
  const cur=bwLatest(),t=bwTrend(28),l=bwSeries(30);
  const input='<div style="display:flex;gap:8px;align-items:center;margin-top:12px">'
   +'<input class="searchbox" style="flex:1" type="number" inputmode="decimal" step="0.1" id="bw-quick" value="'+(cur==null?'':fw(cur))+'" placeholder="Today\'s bodyweight" onchange="G.logBwToday(this.value)">'
   +'<span style="font-size:11.5px;color:var(--dim);font-weight:700">'+wl()+'</span></div>';
  if(cur==null&&!l.length){

     +'<div class="card"><div style="font-size:12.5px;color:var(--mut);line-height:1.65">'
     +'Log your bodyweight and FORGE can relate your strength to your body size. It is never shared and never required.</div>'+input+'</div></div>';
  }
  const span=vs=>{const a=Math.min.apply(null,vs),b=Math.max.apply(null,vs);return fw(a)+'–'+fw(b)+' '+wl()};
  let head='<div class="statrow" style="grid-template-columns:repeat(2,1fr)">'
   +'<div class="stat"><div class="sv">'+fw(cur)+'</div><div class="sl">Now · '+wl()+'</div></div>';
  if(t){
    const d=fw(Math.abs(t.delta));
    head+='<div class="stat"><div class="sv">'+(t.delta>0?'+':'')+ (t.delta<0?'-':'')+d+'</div>'
      +'<div class="sl">'+(t.delta>=0?'Gained':'Lost')+' · '+(t.n)+' logs</div>'
      +'<div class="sd flat">since '+dShort(t.from)+'</div></div>';
  }else{
    head+='<div class="stat"><div class="sv">'+l.length+'</div><div class="sl">Logs · '+wl()+'</div><div class="sd flat">need two to trend</div></div>';
  }
  head+='</div>';
  let chart='';
  if(l.length>1){
    const vs=l.map(e=>e.kg);
    const lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs);
    chart='<div class="card">'+svgBw(l.map(e=>({y:e.kg,d:e.date})))
     +'<div style="font-size:11px;color:var(--dim);line-height:1.5;margin-top:8px">'
     +'The axis spans only what you logged ('+fw(lo)+'–'+fw(hi)+' '+wl()+'), so a small change looks large. Read the numbers, not the slope.</div>'
     +'<div style="font-size:11px;color:var(--dim);line-height:1.5;margin-top:5px">'
     +'Day-to-day bodyweight swings with food, salt and water. Only a change sustained over weeks is a signal.</div></div>';
  }
  return '<div class="sect"><div class="sect-h"><span class="sect-t">Bodyweight</span><span class="sect-s">'
   +(t?(t.perWeek!=null?(t.perWeek>0?'+':'')+ (t.perWeek<0?'-':'')+fw(Math.abs(t.perWeek))+' / week':t.n+' logs'):'last 30 logs')+'</span></div>'
   +head+chart
   +'<div class="card" style="margin-top:10px">'+input
   +(l.length>4?'<button class="btn btn-sm btn-ghost btn-block" style="margin-top:10px" onclick="G.clearBwLog()">Clear bodyweight history</button>':'')
   +'</div></div>';
}

const SBD_CITE='van den Hoek et al. 2024, J Sci Med Sport 27(10):734-742';
/* The published table is 9 buckets per sex, not a continuum, so a bodyweight
   SNAPS to its class and that class is always shown. An interpolated number
   would imply a precision the underlying table does not have. */
const IPF_CLASSES={
  female:[[43,'43'],[47,'47'],[52,'52'],[57,'57'],[63,'63'],[69,'69'],[76,'76'],[84,'84'],[Infinity,'84+']],
  male:[[53,'53'],[59,'59'],[66,'66'],[74,'74'],[83,'83'],[93,'93'],[105,'105'],[120,'120'],[Infinity,'120+']]
};
function stdSex(){const s=prof().sex;return s==='m'?'male':(s==='f'?'female':null)}
function stdClass(sex,bw){
  const t=IPF_CLASSES[sex];if(!t||!(bw>0))return null;
  for(let i=0;i<t.length;i++){if(bw<=t[i][0])return t[i][1]}
  return t[t.length-1][1];
}
/* the user's own best estimate as a multiple of bodyweight — descriptive only */
function stdRatio(k){
  const L=SBD_LIFTS[k];if(!L)return null;
  const bw=bwLatest();if(!(bw>0))return null;
  const be=bestEver(L.id);
  if(!be||!be.set||!(be.e1>0))return null;
  return{ratio:be.e1/bw,e1:be.e1,set:be.set,kg:bw};
}
function stdBand(k){
  const sex=stdSex();if(!sex)return null;
  const bw=bwLatest();if(!(bw>0))return null;
  const cls=stdClass(sex,bw);if(!cls)return null;
  const row=(SBD_NORMS[sex]||{})[cls];if(!row)return null;
  const arr=row[k];if(!arr||arr.length<9)return null;
  return{sex:sex,cls:cls,values:arr.slice(),p10:arr[0],p50:arr[4],p90:arr[8]};
}
function stdWhyMissing(){
  const p=prof();
  const noSex=!p.sex,noBw=!(bwLatest()>0);
  if(noSex&&noBw)return 'Two details stand between you and the comparison, and neither is guessed.';
  if(noSex)return 'Pick which published table to compare against. The norms are split into male and female classes and there is no third table.';
  if(noBw)return 'Log a bodyweight and the bands are exact.';
  return 'Log a squat, bench or deadlift session to use this.';
}

   +'Reference range: <b style="color:var(--mut)">drug-tested, unequipped powerlifting competitors</b> — a competition population, not the general gym population. Cut-points are 10th, 50th and 90th decile of maximum successful competition lifts divided by bodyweight. '
   +'A competition single is a tested maximum; the number above is a formula estimate, which usually reads lower. Bodyweight classes are the standard IPF buckets, so your bodyweight snaps to the nearest one.'
   +'<br>'+SBD_CITE+' · CC BY 4.0</div>'
   +'<button class="btn btn-sm btn-ghost btn-block" style="margin-top:12px" onclick="G.setStandards(false)">Hide standards</button></div></div>';
}

    const en=sess&&sess.entries[i];if(!en)return;

    if(en.sets.length<=1){toast('Last set · use Remove exercise instead');return}

  bump(i,k,f,d){
    const en=sess.entries[i],st=en.sets[k];
    if(st.done){toast('Set already logged · untick to change');return}
    if(f==='w'){const ex=EXBY[en.id];if(ex.bw)return;st.w=uw(dw(st.w)+d*stepKg(ex.def));if(st.w<0)st.w=0}
    else st.r=Math.min(60,Math.max(0,st.r+d));
    /* surgical update: touch only this cell so hold-repeat cannot flash the page */
    const row=document.querySelector('[data-row="'+i+'-'+k+'"]');
    if(row){
      const wv=row.querySelector('[data-w]'),rv=row.querySelector('[data-r]');
      if(wv)wv.innerHTML=fw(st.w)+'<small>'+wl()+(EXBY[en.id].db?' EA':'')+'</small>';
      if(rv)rv.innerHTML=st.r+'<small>'+repWord(EXBY[en.id])+'</small>';
    }else{
      rerender();
    }

  checkSet(i,k){
    const en=sess.entries[i],st=en.sets[k],ex=EXBY[en.id];
    if(st.done){st.done=false;delete st.ts;rerender();return}
    if(!ex.bw&&st.w<=0){toast('Add a load first');return}
    if(st.r<=0){toast('Log some reps');return}
    st.done=true;st.ts=Date.now();
    const pv=prevSum(en.id,todayISO());
    /* a warm-up can never be a volume PR — only working sets compete */
    if(pv&&!en._pr&&countsVol(st)){
      const v=volSets(en.sets.filter(s=>s.done)).reduce((x,s)=>x+repLoad(en.id,s.w)*s.r,0);
      if(v>entryVol(pv.e)&&entryVol(pv.e)>0){en._pr=true;boom();toast('<b>VOLUME PR</b> · '+ex.n+' · +'+comp(v-entryVol(pv.e))+' '+wl(),'hot')}
    }
    restStart(ex.def.rest,ex.n.toUpperCase());
    rerender();

  /* ---- effort (RIR) ----

  rirMenu(i,k){
    const en=sess&&sess.entries[i];if(!en)return;

      +'<div style="margin-top:14px;font-size:11.5px;color:var(--dim);line-height:1.55">Your target is <b style="color:var(--mut)">'+prof().rir+' in reserve</b>. Effort is a soft input: it steers the next load only when the reading is decisive for your experience level, or when the same signal shows up two sessions running. It never overrides the weight and reps you actually logged.</div>'

     +'<div class="libmeta" style="line-height:1.55">How many reps were left in the tank on this set. Logged per set, never per exercise.</div></span><span class="pk-add">'+(rv===null?'+':'→')+'</span></button>'
     +'<button class="pickrow" onclick="G.setKind('+i+','+k+',null)"><span style="min-width:0"><span class="libname">'+(cur?'Working set':'Working set ✓')+'</span>'

  setKind(i,k,kind){
    const en=sess&&sess.entries[i];if(!en)return;
    const st=en.sets[k];if(!st)return;
    if(kind)st.k=kind;else delete st.k;

  },
  /* One tap inserts a marked warm-up ramp. Marking is the whole point: an
     unmarked warm-up would be counted as training volume and would distort
     every per-muscle number the coach reports. */
  addWarmups(i){
    const en=sess&&sess.entries[i];if(!en)return;
    const ex=EXBY[en.id];
    if(ex.bw){toast('Bodyweight lift — no ramp to calculate');return}
    /* re-ramping replaces the ramp rather than stacking a second one; the working
       sets and their logged effort are untouched */
    en.sets=en.sets.filter(s=>!isWarm(s));
    const work=volSets(en.sets).map(s=>s.w).filter(w=>w>0);
    const top=work.length?Math.max.apply(null,work):nextLoad(en.id).w;
    if(!(top>0)){toast('Add a working load first');return}
    const ramp=warmupRamp(top);
    if(!ramp.length){toast('Load too light to ramp');return}
    en.sets=ramp.map(r=>({w:r.w,r:r.r,k:'wu',done:false})).concat(en.sets);
    rerender();
    toast(ramp.length+' warm-up sets · excluded from volume and PRs');
  },
  finishFlow,
  save(){
    const dur=Math.round((Date.now()-sess.t0)/1000);
    const rec={id:'w'+Date.now(),date:todayISO(),name:sess.name,routineId:sess.routineId,dur,
      entries:sess.entries.map(en=>{
        const sets=en.sets.filter(s=>s.done).map(s=>{
          const o={w:r125(s.w),r:s.r};
          /* set kind: absent means an ordinary working set, which is also what
             every pre-existing record means — so this stays backward-safe */
          if(s.k)o.k=s.k;
          /* effort belongs to the set (0-5 reps in reserve); absent means that
             set's hardness was never verified, never "easy" */
          if(typeof s.rir==='number')o.rir=s.rir;
          /* seconds into the session: unlocks rest-interval analysis, which is
             otherwise unrecoverable from a weight/rep log */
          if(s.ts)o.t=Math.max(0,Math.round((s.ts-sess.t0)/1000));
          return o;
        });
        const e={id:en.id,sets:sets};
        /* The exercise-level value is now DERIVED — the hardest working set that
           was actually saved — and written only so readers and export files that
           predate per-set effort keep working. The per-set values above are the
           record. Derived from the SAVED sets, so a reading on a set that was
           never ticked off cannot leak into the log. */
        const sum=entryRir(Object.assign({},en,{sets:sets}));
        if(sum!==null)e.rir=sum;
        return e;
      }).filter(en=>en.sets.length)};
    rec.prCount=sess.entries.filter(en=>en._pr).length;
    S.hist.push(rec);S.hist.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:(String(a.id)<String(b.id)?-1:1));
    S.prog={lastDate:rec.date,lastRid:rec.routineId||null};
    saveLS();
    sess=null;closeModal();
    if(rec.prCount>0)boom();
    toast('Saved · next up: '+nextDayName());
    nav('train');
  },

  delSession(id){if(!confirm('Delete this session permanently?'))return;S.hist=S.hist.filter(s=>s.id!==id);saveLS();rerender();toast('Deleted')},
  /* ---- saved-session editor ---- */
  openSessionEdit,
  editBump(ei,si,f,d){
    const s=curEditSession();if(!s)return;
    const en=s.entries[ei];if(!en)return;
    const st=en.sets[si];if(!st)return;
    const ex=EXBY[en.id];
    if(f==='w')st.w=Math.max(0,r125(st.w+d*((ex&&ex.inc)||2.5)));
    else st.r=Math.max(0,Math.min(200,st.r+d));
    saveLS();paintSessionEdit();
  },

    const i=order.indexOf(setKind(st));
    const next=order[(i+1)%order.length];
    if(next)st.k=next;else delete st.k;
    saveLS();paintSessionEdit();
  },

  editRirMenu(ei,si){

     window.S3D_MEASURED — _s3d_clips_measured.js, the clips derived from measured reference angles

   WHY THIS EXISTS
   The 48 library demos are a 2D vector engine: one skeleton, one 200x200 viewBox, authored as limb
   targets. That engine is stylised and it is NOT measured. A separate body of work measured real
   licensed reference video by pose estimation and produced joint angles that drive a 3D rig. Those
   measured angles were only viewable on a published page outside the app. This module puts the same
   3D character inside the app, driven by the same measured numbers.

   WHAT IT DELIBERATELY DOES NOT DO
   It does not put 3D on every exercise. Only exercises whose movement was actually measured from
   licensed reference video get a 3D clip, because the entire value of this view is that the motion
   is measured. Filling the rest would mean inventing motion and presenting it as measurement, which
   is the failure this project spent its effort eliminating. `has3D()` is the single gate, and the
   app falls back to its own 2D demo everywhere else.

   IT PLUGS INTO THE EXISTING LOOP CONTRACT
   `startAnimLoop` in index.html advances `el.__t` (0..1 over CYCLE) on `el.__raf` and honours the
   global `demoPlay`. This module reuses ALL THREE, so `demoToggle()` and `demoStep()` drive the 3D
   view with no changes at all, and `stopDemo()` (called by `closeModal()`) cancels the frame loop on
   every close path. The clip is sampled at `el.__t * clip.duration`; because every measured clip is
   3.14 s with keys on the app's own tempo boundaries (1500/320/1000/320 ms), that fraction lands on
   the same phase the HUD is naming. If a clip's duration ever drifts off 3.14 the pose and the phase
   label would disagree, so `phaseAligned` reports it rather than hiding it.
*/
(function (root) {
  'use strict';

  var S3D = root.S3D, R = root.S3D_RENDER, M = root.S3D_MEASURED, PR = root.S3D_PROPS;
  if (!S3D || !R || !M || !PR) return;           /* the app degrades to its 2D demos */

  /* App exercise id -> measured clip name.
     Every entry here is a mapping that was checked by hand against the reference that was measured:
     a squat is a squat, an overhead press is an overhead press, a leg extension is a leg extension,
     and a machine chest press is a machine chest press. Deliberately absent: `machine-ohp`, which
     looks close to the measured barbell overhead press but is a different machine and a different
     movement path, and the CDC arm-extension and bicep-machine clips, whose elbow range is shared by
     several exercises (a pushdown and an overhead extension have the same elbow angle) so the angles
     cannot say which exercise they belong to. Guessing either would be a wrong-variant reference,
     which is worse than none because it looks authoritative. */

    'squat': 'squat',
    'ohp': 'press',
    'legext': 'legext',
    'machine-press': 'machinepress'

  var TEMPO_CYCLE_MS = 3140;                     /* index.html CYCLE, the app's shared tempo */
  var PHASE_DUR_S = 3.14;                        /* that tempo expressed in seconds */

  var _ch = null, _geo = null, _props = null, _gl3 = null;
  function character() {
    if (!_ch) {
      _ch = S3D.buildCharacter();
      _geo = S3D.packGeometry(_ch);
      _props = PR.build(_ch);
    }
    return _ch;
  }
  /* Equipment for this instant. Wrapped because a prop is scenery: if it ever fails it must not take
     the measured figure down with it. */
  function propsFor(ev, clipName) {
    try { return PR.frame(_props, _ch, S3D, ev, clipName, S3D.sample); }
    catch (e) { return []; }
  }

  function clipFor(id) {
    var n = CLIP_FOR_EX[id];
    if (!n || !S3D.CLIPS[n]) return null;
    /* A registered clip is not enough, and this guard is load-bearing. _s3d_core.js ships SANDBOX
       clips of its own, one of which is ALSO called 'squat' (duration 3.6 s, no measured targets,
       authored as a solver demo). Without this check, if the measured squat clip ever failed to
       arrive the app would render that sandbox motion under the measured badge and a genuine-looking
       provenance line: invented movement presented as measured, which is worse than offering no 3D
       at all, because it looks authoritative. Only a clip that records its measured targets counts. */
    if (!M || !M.TARGETS || !M.TARGETS[n]) return null;
    return n;
  }
  function has3D(id) { return !!clipFor(id); }

  /* Can this device actually run it? Asked once and cached, because a failed webgl2 request is
     expensive and because the answer must be the same for every exercise in a session. */

  }

  /* The provenance line. A measured view has to say what it was measured from, and for the CC-BY
     reference that is also the attribution the licence requires — so it is rendered on screen, not
     buried in a file. Read defensively: if a clip records no provenance we say so plainly rather
     than printing nothing, because silence would read as "no source needed". */
  function provenance(id) {

    if (!name) return '';

    if (!t) return 'Measured reference \u2014 source not recorded';
    var src = t.source || t.title || 'source not recorded';

    /* Release the GL context explicitly. Browsers cap live WebGL contexts (Chrome allows ~16) and
       every open/close of a sheet would otherwise leak one until the oldest is silently dropped. */

    destroy(el);
    /* The app's play flag (`demoPlay`) is a local in index.html's script scope, not a window global.
       Rather than reach for it by a scoping trick, the app passes it in — which keeps this module
       loadable and testable on its own, and makes the dependency explicit at the call site. */

      catch (e) { return false; }

       its own frame; if this loop did not, the HUD would freeze on whatever the last 2D frame left
       there while the 3D body kept moving — the screen would confidently name the wrong phase. The
       app passes its own updater in, so `stageAt()` stays the single source of phase truth. */

       box is 12px narrower. Sizing straight from clientWidth overflows the card by 12px. */
    var size = Math.max(180, Math.min(340, (el.clientWidth || 300) - 12));
    var dpr = Math.min(2, root.devicePixelRatio || 1);

    var canvas = document.createElement('canvas');
    canvas.width = Math.round(size * dpr);
    canvas.height = Math.round(size * dpr);
    canvas.style.width = '100%';
    /* height:auto is load-bearing. The stylesheet only sets `height:auto` for `.animstage svg`, and a
       canvas is not an svg — without it the canvas lays out at its ATTRIBUTE height (size*dpr, so
       ~680px at dpr 2) while being stretched to 100% wide, giving a squashed figure in a tall box. */
    canvas.style.height = 'auto';
    canvas.style.aspectRatio = '1 / 1';
    canvas.style.display = 'block';
    canvas.style.borderRadius = '12px';
    canvas.style.touchAction = 'none';            /* so a drag orbits instead of scrolling the sheet */
    canvas.setAttribute('role', 'img');
    canvas.setAttribute('aria-label', 'Three-dimensional technique demonstration, measured from reference video');
    el.appendChild(canvas);

    var ctx;
    try { ctx = R.makeCtx(canvas, ch, _geo); }
    catch (e) { destroy(el); el.innerHTML = ''; return false; }   /* shader/context failure: 2D demo wins */

    var st = el.__s3d = {
      ctx: ctx, canvas: canvas, clip: clipName,
      yaw: 30, pitch: 8, dist: 430, drag: null,
      pinching: 0, pinched: 0

    /* Orbit / zoom. Pointer events cover mouse, pen and touch in one path, which matters because
       this sheet is read at 360-430 px on a phone. */

      st.drag = { x: e.clientX, y: e.clientY };
      canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);

      st.drag = { x: e.clientX, y: e.clientY };

                   { props: propsFor(a, clipName) });

                   R.camera('persp', 1, st.yaw, st.pitch, st.dist),
                   { props: propsFor(b, clipName) });

    capable: capable,

</script>
