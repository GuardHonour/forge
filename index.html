/* The profile is ADDITIVE: an older store simply has no profile key and gets
   sensible defaults, so nothing needs migrating and nothing is lost.
   Every field here is READ by the engine — that is the entry requirement for
   asking. Three that failed it were deleted: `birth`, `equipment` and a
   `bar` increment that duplicated each exercise's own def.inc and was
   mis-labelled as the bar's weight rather than its smallest jump. A store
   written before that still carries them; nothing reads them, so they are inert
   rather than migrated. */
function freshProfile(){return{
  onboarded:false,
  goal:'hypertrophy',   /* hypertrophy | strength | general — grades weekly volume */
  level:'intermediate', /* novice | intermediate | advanced — volume targets + load climb */
  days:4,               /* intended sessions per week — adherence + streak target */
  bw:null,              /* bodyweight in kg — bodyweight lifts + strength standards */
  sex:null,             /* 'm' | 'f' — strength standards ONLY; never guessed */
  rir:2,                /* default effort target in reps in reserve */
  injuries:[],          /* muscle ids / patterns to route around, e.g. ['shoulders'] */
  standardsOn:false,    /* opt-in: published powerlifting comparison bands */
};}
function freshState(){return{v:2,unit:'kg',theme:'volt',split:'ul4',dayEx:{},hist:[],prog:null,profile:freshProfile(),bwLog:[]}}
let S=loadLS();
if(!S||typeof S!=='object'||!Array.isArray(S.hist)){S=freshState();saveLS()}
else{if(!S.unit)S.unit='kg';if(!S.theme)S.theme='volt';if(S.hist.length&&!S.prog)S.prog=null;if(!S.split)S.split='ul4';
  if(!Array.isArray(S.bwLog)){
    /* additive: an existing profile.bw becomes the first (undated) series point */
    S.bwLog=[];
  }
  if(!S.profile||typeof S.profile!=='object')S.profile=freshProfile();
  else{const d=freshProfile();Object.keys(d).forEach(k=>{if(S.profile[k]===undefined)S.profile[k]=d[k]})}}
const prof=()=>S.profile||(S.profile=freshProfile());
/* apply persisted day customizations into the live routine table */
if(S.dayEx){Object.entries(S.dayEx).forEach(([rid,ids])=>{if(ROUTINES[rid]&&Array.isArray(ids))ROUTINES[rid].ex=ids.map(id=>({id:id}))})}

/* ================= COMPUTATION ================= */
/* Load actually moved per rep. Dumbbells are logged PER HAND, so a two-hand
   lift moves double that; single-arm rows and one-bell extensions do not.
   `imp` (implements) states this per exercise instead of assuming. */
const impCount=id=>(EXBY[id]&&EXBY[id].imp)||1;
const repLoad=(id,w)=>w*impCount(id);

/* ================= SET KINDS =================
   Absent `k` means an ordinary working set — which is exactly what every
   record written before this feature has, so old data reads as all-working,
   precisely as it was understood at the time. No migration needed.
     wu    warm-up      real work, but NOT training volume and NOT a max estimate
     drop  drop set     hard volume at reduced load; no usable e1RM
     back  back-off     hard volume, deliberately submaximal
     fail  to failure   hard volume AND the best e1RM evidence available       */
const KINDS={
  wu:{n:'Warm-up',s:'W',c:'var(--dim)',d:'Real work, but not counted as training volume and never a max estimate.'},
  drop:{n:'Drop set',s:'D',c:'var(--gold)',d:'Hard volume at a reduced load. Counts for volume, not for a 1RM estimate.'},
  back:{n:'Back-off',s:'B',c:'var(--mut)',d:'Deliberately lighter hard work. Counts for volume, not for a 1RM estimate.'},
  fail:{n:'To failure',s:'F',c:'var(--hot)',d:'Taken to failure. Counts for volume, and is the best 1RM evidence there is.'}
};
const setKind=s=>(s&&s.k&&KINDS[s.k])?s.k:null;
const kindOf=s=>{const k=setKind(s);return k?KINDS[k]:null};
const isWarm=s=>setKind(s)==='wu';
/* volume counts every set that was genuinely hard work — a warm-up is not */
const countsVol=s=>!isWarm(s);
/* a warm-up, a drop set or a back-off set cannot estimate a 1RM: the load was
   chosen for a purpose other than expressing a maximum */
const countsE1=s=>{const k=setKind(s);return k!=='wu'&&k!=='drop'&&k!=='back'};
const volSets=sets=>(sets||[]).filter(countsVol);
const e1Sets=sets=>(sets||[]).filter(countsE1);
const warmCount=sets=>(sets||[]).filter(isWarm).length;

/* ---- effort (RIR), recorded PER SET ----
   Effort belongs to the set, not to the exercise. Three sets at 5, 2 and 0 reps
   in reserve is one completely ordinary session, and a single number for the
   whole exercise cannot describe it — so `rir` lives on the set row.
   Records saved before per-set effort existed carry only the exercise-level
   `en.rir`; that is still read everywhere. Absent means "hardness unverified",
   never "easy". */
const setRirOf=(st,en)=>(st&&typeof st.rir==='number')?st.rir:((en&&typeof en.rir==='number')?en.rir:null);
const hasRir=st=>!!(st&&typeof st.rir==='number');
/* One reading for a whole exercise = the HARDEST working set, because
   autoregulation asks how close to failure the session actually got, and one set
   taken to 0 RIR is that answer even when the earlier sets had reserve.
   Warm-ups are excluded (a 40 kg ramp set says nothing about capacity); a session
   of nothing but warm-ups falls back to its logged sets so nothing is lost. */
function entryRir(en){
  if(!en)return null;
  const w=volSets(en.sets||[]),use=w.length?w:(en.sets||[]);
  let min=null;
  use.forEach(st=>{if(hasRir(st)&&(min===null||st.rir<min))min=st.rir});
  if(min!==null)return min;
  return (typeof en.rir==='number')?en.rir:null;
}
/* how many working sets carry their own reading */
const loggedRir=en=>volSets((en&&en.sets)||[]).filter(hasRir).length;
/* A very easy set is not a hard set, and the app should say so per set: RIR 5
   counts half toward volume, RIR 0-4 counts fully, unlogged counts fully but is
   reported as unverified. */
const RIR_HARD=4;
function setHardW(st,en){const r=setRirOf(st,en);return r===null?1:(r>RIR_HARD?0.5:1)}
function setStats(en){
  let n=0,v=0;
  volSets((en&&en.sets)||[]).forEach(st=>{const w=setHardW(st,en);n+=w;if(setRirOf(st,en)!==null)v+=w});
  return {n:n,verified:v};
}
const setCount=en=>setStats(en).n;

const entryVol=e=>volSets(e.sets).reduce((a,s)=>a+repLoad(e.id,s.w)*s.r,0);
const sessVol=s=>s.entries.reduce((a,e)=>a+entryVol(e),0);
/* Epley. RIR folds into "effective reps" (a set of 8 at 2 RIR ~ a set of 10).
   Sets logged before RIR existed have no rir field, so their maths is unchanged. */
const e1=(w,r,rir)=>r>0?w*(1+(r+(rir||0))/30):0;
const effReps=(r,rir)=>r+(rir||0);
/* Estimate confidence. Above ~12 effective reps the formula diverges from any
   real 1RM, so the coach refuses to present those as precise numbers. */
function e1conf(w,r,rir){
  const er=effReps(r,rir);
  const c=er<=5?'high':(er<=8?'medium':(er<=12?'low':'poor'));
  return {w:w,r:r,rir:rir||0,eff:er,e1:er>12?w*(1+12/30):e1(w,r,rir),conf:c,ok:er<=12};
}
/* Only sets that could express a maximum count: warm-ups, drop sets and
   back-off sets are deliberately submaximal, so including them would understate
   the estimate. Effort is taken from the set itself when it was logged there
   (the effective-reps adjustment is a per-set property), falling back to the
   exercise-level value on records written before per-set effort existed. */
const bestE1=en=>e1Sets(en.sets).reduce((a,s)=>Math.max(a,e1(s.w,s.r,setRirOf(s,en)||0)),0);
function lastOcc(exId,before){let b=null;for(const s of S.hist){if(before&&s.date>=before)continue;for(const e of s.entries)if(e.id===exId&&(!b||s.date>b.sd))b={sd:s.date,s,e};}return b}
const latest=exId=>lastOcc(exId,null);
/* Previous performance is shown as WORKING sets: a warm-up ramp in the list
   buries the numbers the lifter is actually trying to beat. Falls back to every
   set only when a session was pure warm-up, so the line is never empty. */
function lastSetLine(en){
  const w=volSets(en.sets),use=w.length?w:en.sets;
  return use.map(s=>fw(s.w)+(exDb(en.id)?'×':'×')+s.r).join(', ');
}
function exDb(id){return EXBY[id].db}
/* The plank family is logged in SECONDS, not reps (def.unit:'sec'), and a card
   that says "8 reps" about a plank reads as a bug. */
const repWord=ex=>(ex&&ex.def&&ex.def.unit==='sec')?'SEC':'REPS';
const repLower=ex=>repWord(ex).toLowerCase();
function prevSum(exId,before){const L=lastOcc(exId,before);return L?{sd:L.sd,e:L.e,v:entryVol(L.e)}:null}

function suggest(exId){
  /* The plan-level "start" figure. Train and the Coach deliberately do NOT use
     this: they read nextLoad(), which is RIR-aware and carries the override
     guardrails, so the load you are told to lift is the same in both places. */
  const ex=EXBY[exId],d=ex.def,L=latest(exId);
  if(!L)return{w:ex.bw?0:d.start,note:'First time · starting load'};
  if(ex.bw)return{w:0,note:'Bodyweight · chase reps'};
  /* only working sets drive the next load — a warm-up is not evidence of capacity */
  const sets=volSets(L.e.sets);
  if(!sets.length)return{w:r125(d.start),note:'Only warm-ups logged · starting load'};
  const mx=Math.max.apply(null,sets.map(s=>s.w));
  if(sets.every(s=>s.r>=d.max))return{w:r125(mx+d.inc),note:'Hit '+d.max+'s across · add '+fw(d.inc)+' '+wl()};
  if(sets.some(s=>s.r<d.min)&&mx<=d.start*1.001)return{w:r125(mx),note:'Own the form · same load'};
  return{w:r125(mx),note:'Same load · chase reps'};
}

function weekKeys(n){const out=[],m=mondayOf(todayISO());for(let i=n-1;i>=0;i--)out.push(addDays(m,-7*i));return out}
function weeklyVol(n){const ks=weekKeys(n),map={};S.hist.forEach(s=>{const k=mondayOf(s.date);map[k]=(map[k]||0)+sessVol(s)});return ks.map((k,i)=>({l:i===n-1?'NOW':dShort(addDays(k,1)).split(' ')[0],full:k,v:map[k]||0,cur:i===n-1}))}
function thisWeekStats(){const m=mondayOf(todayISO());const ss=S.hist.filter(s=>s.date>=m);return{n:ss.length,v:ss.reduce((a,s)=>a+sessVol(s),0)}}
/* Streak counts weeks that met the user's OWN target, not a hard-coded 3 —
   otherwise a legitimate 2-day-a-week lifter is permanently shown as failing. */
function streakTarget(){return Math.max(1,prof().days||3)}
function weekStreak(){const cnt={};S.hist.forEach(s=>{const k=mondayOf(s.date);cnt[k]=(cnt[k]||0)+1});const t=streakTarget();let st=0;const cm=mondayOf(todayISO());if((cnt[cm]||0)>=t)st++;for(let i=1;i<40;i++){const mk=addDays(cm,-7*i);if((cnt[mk]||0)>=t)st++;else break}return st}
function slope(ys){const n=ys.length;if(n<2)return 0;let sx=0,sy=0,sxy=0,sxx=0;ys.forEach((y,x)=>{sx+=x;sy+=y;sxy+=x*y;sxx+=x*x});const d=n*sxx-sx*sx;return d?(n*sxy-sx*sy)/d:0}
function niceCeil(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of[1,1.5,2,2.5,3,4,5,6,8,10]){if(m*p>=v)return m*p}return 10*p}
function liftSeries(exId){const out=[];S.hist.forEach(s=>{const e=s.entries.find(x=>x.id===exId);if(e)out.push({d:s.date,y:bestE1(e)})});return out}
function project(exId){
  const seq=liftSeries(exId).filter(p=>p.y>0);if(seq.length<3)return null;
  const tail=seq.slice(-8);
  /* regress log(e1RM) on elapsed DAYS: strength progress is multiplicative and
     a layoff must not be treated like a normal gap between sessions */
  const t0=new Date(tail[0].d+'T00:00:00').getTime();
  const xs=tail.map(p=>(new Date(p.d+'T00:00:00').getTime()-t0)/864e5);
  const ys=tail.map(p=>Math.log(p.y));
  const sl=slopeXY(xs,ys),lastY=seq[seq.length-1].y;
  if(!(sl>0))return{seq:seq,proj:[],pct:null,msg:'Trend is flat right now. More sessions will show whether that is normal variation or a real stall.'};
  let acc=0;const proj=[];
  for(let k=1;k<=12;k++){acc+=Math.pow(0.93,k);proj.push({y:Math.max(0,lastY*Math.exp(sl*7*acc))})}
  const pct=Math.round((proj[11].y/lastY-1)*100);
  return{seq:seq,proj:proj,pct:pct,
    msg:'If your last '+tail.length+' sessions repeat, this drifts toward roughly +'+pct+'% estimated 1RM over 12 weeks.',
    caveat:'A scenario, not a promise. People respond to identical training very differently, and a formula estimate is not a tested max.'};
}
/* Retired: muscleSplit() reported tonnage share by exercise group. Tonnage is a
   poor proxy for stimulus — one heavy squat outweighs a whole session of lateral
   raises — and it disagreed with the set-based volume the Coach already uses.
   Progress now reports the same hard-set currency as the Coach, from the same
   function, so the two surfaces cannot contradict each other. */
function muscleSets(days){
  const from=addDays(todayISO(),-(days||28)),to=todayISO();
  const mv=muscleVolume(from,to);
  const weeks=Math.max(1,(days||28)/7);
  return MUSCLES.map(m=>({id:m.id,name:m.n,group:m.g,
    sets:mv[m.id]?mv[m.id].sets:0,weekly:(mv[m.id]?mv[m.id].sets:0)/weeks}))
    .filter(x=>x.sets>0).sort((a,b)=>b.sets-a.sets);
}
/* Best set by estimated 1RM — consistent with bestE1(). Picking the set with
   the largest tonnage instead would crown a light set of many reps over a
   genuinely heavier low-rep set. */
function bestEver(exId){
  let b=0,bs=null;
  S.hist.forEach(s=>{
    const e=s.entries.find(x=>x.id===exId);
    if(!e||!e.sets||!e.sets.length)return;
    e1Sets(e.sets).forEach(st=>{const ev=e1(st.w,st.r,setRirOf(st,e)||0);if(ev>b){b=ev;bs=st}});
  });
  return {e1:b,set:bs};
}

/* ================= MUSCLE TAXONOMY =================
   The library tags muscles as free text ('Delts', 'Front + side delts',
   'Upper chest', 'Core', 'Back'...). Volume programming needs ONE canonical
   muscle per tag, so every tag normalises through TAGMAP. Unlisted tags are
   ignored on purpose — a wrong attribution is worse than a missing one.      */
const MUSCLES=[
 {id:'chest',      n:'Chest',          g:'Chest',    lm:1},
 {id:'lats',       n:'Lats',           g:'Back',     lm:1},
 {id:'midback',    n:'Upper back',     g:'Back',     lm:1},
 {id:'frontdelts', n:'Front delts',    g:'Shoulders',lm:1},
 {id:'sidedelts',  n:'Side delts',     g:'Shoulders',lm:1},
 {id:'reardelts',  n:'Rear delts',     g:'Shoulders',lm:1},
 {id:'biceps',     n:'Biceps',         g:'Arms',     lm:1},
 {id:'triceps',    n:'Triceps',        g:'Arms',     lm:1},
 {id:'quads',      n:'Quads',          g:'Legs',     lm:1},
 {id:'hams',       n:'Hamstrings',     g:'Legs',     lm:1},
 {id:'glutes',     n:'Glutes',         g:'Legs',     lm:1},
 {id:'calves',     n:'Calves',         g:'Legs',     lm:1},
 {id:'abs',        n:'Abs',            g:'Core',     lm:1},
 {id:'erectors',   n:'Spinal erectors',g:'Back',     lm:0},
 {id:'forearms',   n:'Forearms / grip',g:'Arms',     lm:0},
 {id:'adductors',  n:'Adductors',      g:'Legs',     lm:0},
 {id:'hipflexors', n:'Hip flexors',    g:'Core',     lm:0},
 {id:'rotatorcuff',n:'Rotator cuff',   g:'Shoulders',lm:0},
];
const MUSBY={};MUSCLES.forEach(m=>MUSBY[m.id]=m);
/* 'a+b' means the tag genuinely covers two muscles (a press drives front AND
   side delts); it is counted at half weight for each rather than guessed. */
const TAGMAP={
 'chest':'chest','upper chest':'chest','lower chest':'chest','pecs':'chest',
 'lats':'lats','back':'lats+midback',
 'mid-back':'midback','traps':'midback',
 'front delts':'frontdelts','delts':'frontdelts+sidedelts','front + side delts':'frontdelts+sidedelts',
 'side delts':'sidedelts','shoulders':'sidedelts',
 'rear delts':'reardelts','rotator cuff':'rotatorcuff',
 'biceps':'biceps','brachialis':'biceps',
 'triceps':'triceps','forearms':'forearms','grip':'forearms',
 'quads':'quads','hamstrings':'hams','glutes':'glutes','calves':'calves','adductors':'adductors',
 'abs':'abs','core':'abs','lower back':'erectors','hip flexors':'hipflexors',
};
const exCache={};
/* canonical muscles for one exercise: {p:[primary], s:[secondary-only]} */
function exMuscles(id){
  if(exCache[id])return exCache[id];
  const ex=EXBY[id];
  if(!ex)return exCache[id]={p:[],s:[]};
  const p=[],s=[];
  (ex.m||[]).forEach(t=>tagToMuscles(t).forEach(m=>{if(p.indexOf(m)<0)p.push(m)}));
  (ex.m2||[]).forEach(t=>tagToMuscles(t).forEach(m=>{if(p.indexOf(m)<0&&s.indexOf(m)<0)s.push(m)}));
  return exCache[id]={p:p,s:s};
}
const tagToMuscles=t=>{const v=TAGMAP[String(t||'').toLowerCase()];return v?v.split('+'):[]};
/* A set only counts toward volume if it was hard enough to matter: at RIR 5+
   it is little more than a warm-up, so it counts half.
   This is the ENTRY-LEVEL fallback, kept because `en.rir` is the only effort a
   record written before per-set effort has. It returns one multiplier for the
   whole exercise, which cannot express "set 1 easy, set 3 to failure" — that is
   what setStats()/setCount() below are for, and the volume paths use those. */
function setW(en){
  const rir=(en&&typeof en.rir==='number')?en.rir:null;
  if(rir===null)return 1;            /* unknown: count it, but flag as unverified */
  return rir>RIR_HARD?0.5:1;
}
const WSEC=0.5;
/* per-muscle working sets + volume over an inclusive date window.
   Also reports how much of that volume had VERIFIED hardness (RIR logged). */
function muscleVolume(from,to){
  const out={};
  MUSCLES.forEach(m=>out[m.id]={id:m.id,sets:0,vol:0,sess:0,last:null,verified:0,unverified:0,_sd:{}});
  S.hist.forEach(s=>{
    if(from&&s.date<from)return;if(to&&s.date>to)return;
    s.entries.forEach(en=>{
      const mx=exMuscles(en.id),st=setStats(en),n=st.n;
      if(!n)return;
      const v=entryVol(en),vn=st.verified;
      const touch=id=>{
        out[id].sets+=n;out[id].vol+=v;
        out[id].verified+=vn;out[id].unverified+=n-vn;
        out[id]._sd[s.date]=1;
        if(!out[id].last||s.date>out[id].last)out[id].last=s.date;
      };
      mx.p.forEach(touch);
      mx.s.forEach(id=>{out[id].sets+=n*WSEC;out[id].vol+=v*WSEC;
        out[id].verified+=vn*WSEC;out[id].unverified+=(n-vn)*WSEC;
        out[id]._sd[s.date]=1;
        if(!out[id].last||s.date>out[id].last)out[id].last=s.date;});
    });
  });
  MUSCLES.forEach(m=>{
    const o=out[m.id];
    o.sets=Math.round(o.sets*10)/10;o.verified=Math.round(o.verified*10)/10;
    o.unverified=Math.round(o.unverified*10)/10;
    o.sess=Object.keys(o._sd).length;delete o._sd;
  });
  return out;
}
/* sets per muscle per week for the last n weeks (oldest -> newest) */
function muscleWeekly(mid,n){
  const wks=weekKeys(n),idx={};wks.forEach((k,i)=>idx[k]=i);
  const arr=wks.map(()=>0);
  S.hist.forEach(s=>{const i=idx[mondayOf(s.date)];if(i===undefined)return;
    s.entries.forEach(en=>{const mx=exMuscles(en.id);if(mx.p.indexOf(mid)<0&&mx.s.indexOf(mid)<0)return;
      const n2=setStats(en).n;
      arr[i]+=mx.p.indexOf(mid)>=0?n2:n2*WSEC;});});
  return arr.map(v=>Math.round(v*10)/10);
}
/* linear trend of an array (oldest -> newest) */
function trendOf(a){return a.length<2?0:slope(a)}

/* ================= TRACKING: PER LIFT =================
   Everything below is DERIVED from the existing log — no migration, and it
   keeps working on history recorded before any of this existed.            */
/* bodyweight lifts have no meaningful 1RM, so they are scored on reps */
const isBw=id=>!!(EXBY[id]&&EXBY[id].bw);
function exHistory(exId){
  const bw=isBw(exId),out=[];
  S.hist.forEach(s=>{
    const en=s.entries.find(x=>x.id===exId&&x.sets&&x.sets.length);
    if(!en)return;
    /* warm-ups are excluded: a session of nothing but warm-ups is not history */
    const sets=volSets(en.sets);
    if(!sets.length)return;
    const top=sets.reduce((a,b)=>(b.w*b.r>a.w*a.r?b:a),sets[0]);
    out.push({date:s.date,sid:s.id,idx:s.id,
      e1:bw?sets.reduce((a,x)=>a+x.r,0):bestE1(en),
      top:top,reps:sets.reduce((a,x)=>a+x.r,0),sets:sets.length,
      vol:entryVol(en),rir:entryRir(en),rirSets:loggedRir(en)});
  });
  return out;
}
const bwNote=id=>isBw(id)?'reps':'e1RM';
/* general least squares over arbitrary x (used for date-based trends) */
function slopeXY(xs,ys){
  const n=xs.length;if(n<2)return 0;
  let sx=0,sy=0,sxy=0,sxx=0;
  for(let i=0;i<n;i++){sx+=xs[i];sy+=ys[i];sxy+=xs[i]*ys[i];sxx+=xs[i]*xs[i]}
  const d=n*sxx-sx*sx;return d?(n*sxy-sx*sy)/d:0;
}
/* Estimated-1RM RANGE. Three published formulas on the same set give a spread
   that is itself the honest error bar — a single point value is false
   precision. Epley stays the canonical series for trends. */
function e1Range(w,r,rir){
  const er=r+(rir||0);
  if(!(w>0)||er<=0)return null;
  const vals=[w*(1+er/30),w*36/(37-er),w*(1+er/40)].filter(v=>isFinite(v)&&v>0);
  if(!vals.length)return null;
  return {lo:Math.min.apply(null,vals),hi:Math.max.apply(null,vals),mid:w*(1+er/30)};
}
/* Measurement noise. Typical error = sd(consecutive changes)/sqrt(2), measured
   per lift once there is enough history, otherwise a conservative 4% assumed. */
function typicalError(exId){
  const h=exHistory(exId).filter(p=>p.e1>0);
  if(h.length<6)return {te:0.04,source:'assumed'};
  const d=[];
  for(let i=1;i<h.length;i++)d.push((h[i].e1-h[i-1].e1)/h[i-1].e1);
  if(d.length<5)return {te:0.04,source:'assumed'};
  const m=d.reduce((a,b)=>a+b,0)/d.length;
  const v=d.reduce((a,b)=>a+(b-m)*(b-m),0)/(d.length-1);
  return {te:Math.max(0.01,Math.sqrt(v)/Math.SQRT2),source:'measured'};
}
/* Smallest worthwhile change: 20% of between-session spread, floored at 2.5% */
function swc(exId){
  const v=exHistory(exId).map(p=>p.e1).filter(x=>x>0);
  if(v.length<4)return 0.025;
  const m=v.reduce((a,b)=>a+b,0)/v.length;
  if(!m)return 0.025;
  const sd=Math.sqrt(v.reduce((a,b)=>a+(b-m)*(b-m),0)/(v.length-1));
  return Math.max(0.025,0.2*(sd/m));
}
/* Progress trend, regressed on ELAPSED DAYS (not session index — a three-week
   layoff and a three-day gap are not the same thing) and on log(e1RM), because
   strength progress is multiplicative. Reported as % per week. */
function liftTrend(exId,n){
  const h=exHistory(exId).filter(p=>p.e1>0),k=n||8;
  if(h.length<2)return null;
  const tail=h.slice(-k);
  if(tail.length<2)return null;
  const t0=new Date(tail[0].date+'T00:00:00').getTime();
  const xs=tail.map(p=>(new Date(p.date+'T00:00:00').getTime()-t0)/864e5);
  const ys=tail.map(p=>Math.log(p.e1));
  const span=xs[xs.length-1];
  const perWeek=span>0?(Math.exp(slopeXY(xs,ys)*7)-1)*100:0;
  return {n:tail.length,from:tail[0].date,to:tail[tail.length-1].date,days:span,
    perWeek:perWeek,first:tail[0].e1,last:tail[tail.length-1].e1,
    pct:tail[0].e1?((tail[tail.length-1].e1/tail[0].e1-1)*100):0,series:tail};
}
/* Stall detection that has to beat measurement noise: a change smaller than the
   smallest worthwhile change is indistinguishable from normal variation, so we
   say "no measurable progress yet" rather than "plateaued". */
function stallInfo(exId){
  const h=exHistory(exId).filter(p=>p.e1>0);
  if(h.length<4)return {enough:false,sessions:h.length};
  const last4=h.slice(-4),prev4=h.slice(-8,-4);
  let best=-1,bestI=0;
  h.forEach((p,i)=>{if(p.e1>best){best=p.e1;bestI=i}});
  const since=h.length-1-bestI;
  if(prev4.length<2)return {enough:false,sessions:h.length,since:since,best:best,bestDate:h[bestI].date};
  const mxLast=Math.max.apply(null,last4.map(p=>p.e1));
  const mxPrev=Math.max.apply(null,prev4.map(p=>p.e1));
  const s=swc(exId),te=typicalError(exId).te;
  const mean=last4.reduce((a,p)=>a+p.e1,0)/last4.length;
  const within=mean>0&&last4.every(p=>Math.abs(p.e1-mean)/mean<=te);
  return {enough:true,sessions:h.length,since:since,best:best,bestDate:h[bestI].date,
    te:te,swc:s,mxLast:mxLast,mxPrev:mxPrev,
    flat:(mxLast<mxPrev*(1+s))&&within};
}
/* Set-to-set rep decay at a fixed load. For hard sets the expected pattern is
   roughly 70% / 55% / 50% of the first set's reps, flattening from set five.
   Bigger drops suggest fatigue; smaller drops suggest more was in reserve. */
const REPDROP=[1,0.70,0.55,0.50];
function repDrop(en){
  const sets=volSets(en.sets||[]).filter(s=>s.r>0);
  if(sets.length<3)return null;
  const first=sets[0].r;
  const ratios=[];
  for(let i=1;i<sets.length;i++){
    const exp=first*(REPDROP[i]!==undefined?REPDROP[i]:0.5);
    if(exp>0)ratios.push(sets[i].r/exp);
  }
  if(!ratios.length)return null;
  const avg=ratios.reduce((a,b)=>a+b,0)/ratios.length;
  return {first:first,ratio:avg,sets:sets.map(s=>s.r),
    note:avg<0.85?'Reps fell faster than a hard set usually does — fatigue, or not enough rest between sets.'
      :(avg>1.15?'Reps held up better than a hard set usually does — there was probably more in reserve than reported.'
      :'Rep behaviour is in line with genuinely hard sets.')};
}
/* per-lift set of derived facts used by the coach */
function liftReport(exId){
  const ex=EXBY[exId],h=exHistory(exId);
  if(!h.length)return {id:exId,name:ex?ex.n:exId,n:0};
  const last=h[h.length-1],prev=h.length>1?h[h.length-2]:null;
  const be=bestEver(exId),tr=liftTrend(exId,8),st=stallInfo(exId);
  return {id:exId,name:ex.n,bw:isBw(exId),n:h.length,last:last,prev:prev,
    best:be,trend:tr,stall:st,delta:prev?last.e1-prev.e1:0};
}

/* ================= TRACKING: BODY & LOAD ================= */
/* sessions/week actually achieved over the last n weeks (adherence to plan) */
function adherence(n){
  const wks=weekKeys(n||4),per=wks.map(k=>S.hist.filter(s=>mondayOf(s.date)===k).length);
  const done=per.reduce((a,b)=>a+b,0);
  return {perWeek:per,avg:per.length?done/per.length:0,target:(prof().days||4),weeks:wks.length};
}
/* acute:chronic workload ratio on weighted sets — the standard fatigue proxy.
   Acute = last 7d, chronic = 28d weekly mean. Guarded against tiny denominators. */
function acwr(){
  const to=todayISO();
  const acute=Object.values(muscleVolume(addDays(to,-6),to)).reduce((a,m)=>a+m.sets,0);
  const chron4=Object.values(muscleVolume(addDays(to,-27),to)).reduce((a,m)=>a+m.sets,0);
  const chronic=chron4/4;
  return {acute:acute,chronic:chronic,ratio:chronic>1?acute/chronic:null};
}
/* muscle balance pairs that matter for joint health and posture */
function balance(){
  const to=todayISO(),from=addDays(to,-27),mv=muscleVolume(from,to);
  const g=id=>mv[id]?mv[id].sets:0;
  const pairs=[['chest','midback','Horizontal push : pull'],['quads','hams','Quad : hamstring'],
               ['biceps','triceps','Elbow flexor : extensor']];
  return pairs.map(([a,b,label])=>{
    const x=g(a),y=g(b),r=y>0?x/y:null;
    return {a:a,b:b,label:label,x:x,y:y,ratio:r,
      note:r==null?'not enough data':(r>1.25?'push-biased':(r<0.8?'pull-biased':'balanced'))};
  });
}

/* ================= VOLUME LANDMARKS & PRESCRIPTION =================
   Weekly working-set landmarks per muscle: [MEV, MAV, MRV] = minimum
   effective, adaptive (productive), maximum recoverable volume, scaled by
   training level. These are programming heuristics informed by dose-response
   research — a starting model for an individual, not a measured constant.
   The whole engine reads them from here so they can be tuned in one place. */
const VLM={
 chest:      {novice:[6,12,18],intermediate:[8,15,22],advanced:[10,18,26]},
 lats:       {novice:[6,12,18],intermediate:[8,15,22],advanced:[10,18,26]},
 midback:    {novice:[6,12,18],intermediate:[8,15,22],advanced:[10,18,26]},
 frontdelts: {novice:[4, 9,14],intermediate:[6,12,18],advanced:[8,15,22]},
 sidedelts:  {novice:[4,10,16],intermediate:[6,14,22],advanced:[8,18,28]},
 reardelts:  {novice:[4,10,16],intermediate:[6,13,20],advanced:[8,16,24]},
 biceps:     {novice:[4, 9,14],intermediate:[6,12,18],advanced:[8,15,22]},
 triceps:    {novice:[4, 9,14],intermediate:[6,12,18],advanced:[8,15,22]},
 quads:      {novice:[6,12,18],intermediate:[8,15,22],advanced:[10,18,26]},
 hams:       {novice:[5,10,16],intermediate:[7,14,20],advanced:[9,17,24]},
 glutes:     {novice:[5,10,16],intermediate:[7,14,20],advanced:[9,17,24]},
 calves:     {novice:[4,10,16],intermediate:[6,13,20],advanced:[8,16,24]},
 abs:        {novice:[4, 9,14],intermediate:[6,12,18],advanced:[8,15,20]},
};
/* The GOAL question used to be asked and then ignored — nothing read it. It now
   sets where in the band a week is graded, because that is the honest way a
   goal changes the same log. A strength block runs fewer sets per muscle at a
   higher intensity, and a general-health week only has to clear the minimum
   effective volume, while a hypertrophy week is graded against the productive
   target as before. Another programming heuristic in the spirit of VLM — a
   starting model, not a measured constant — and hypertrophy is deliberately the
   identity (1,1,1) so nothing already graded changes meaning. */
const GOAL_TUNE={
  hypertrophy:{mev:1,   mav:1,   mrv:1,
    what:'Graded against the productive target: the volume that usually drives growth.'},
  strength:{mev:1,   mav:0.85, mrv:0.9,
    what:'Graded lower on purpose: heavy work costs more recovery per set, so fewer sets per muscle is on target.'},
  general:{mev:0.8, mav:0.75, mrv:0.85,
    what:'Graded against the minimum that keeps progress: general health does not need the growth ceiling.'},
};
function goalTune(){const g=prof().goal;return GOAL_TUNE[g]||GOAL_TUNE.hypertrophy}
function landmarks(mid){
  const t=VLM[mid];if(!t)return null;
  const lv=prof().level||'intermediate';
  const b=t[lv]||t.intermediate;
  const k=goalTune();
  const r=[Math.max(1,Math.round(b[0]*k.mev)),Math.round(b[1]*k.mav),Math.round(b[2]*k.mrv)];
  /* rounding must never collapse or invert the band — MEV < target < ceiling */
  if(r[1]<=r[0])r[1]=r[0]+1;
  if(r[2]<=r[1])r[2]=r[1]+1;
  return r;
}
/* frequency: hypertrophy responds best to hitting a muscle ~2x/week or more */
const FREQ_MIN=2;
function volStatus(sets,lm){
  if(!lm)return 'untracked';
  if(sets<lm[0])return 'under';
  if(sets>lm[2])return 'over';
  if(sets>=lm[1])return 'optimal';
  return 'ok';
}
/* full per-muscle picture for the last 7 days, graded against landmarks */
function volumeCheck(){
  const to=todayISO(),from=addDays(to,-6);
  const mv=muscleVolume(from,to),rows=[];
  MUSCLES.filter(m=>m.lm).forEach(m=>{
    const v=mv[m.id],lm=landmarks(m.id);
    rows.push({id:m.id,n:m.n,g:m.g,sets:v.sets,vol:v.vol,sess:v.sess,lm:lm,
      status:volStatus(v.sets,lm),last:v.last,
      pct:lm?Math.min(999,Math.round(v.sets/lm[1]*100)):0,
      freqOk:v.sess>=FREQ_MIN});
  });
  return rows.sort((a,b)=>(b.sets-a.sets));
}
/* muscles trained hard but rarely, or barely at all — the two failure modes */
function volumeGaps(){
  const rows=volumeCheck();
  const under=rows.filter(r=>r.status==='under').sort((a,b)=>a.sets-b.sets);
  const over=rows.filter(r=>r.status==='over');
  const infrequent=rows.filter(r=>r.sets>0&&!r.freqOk);
  const untrained=rows.filter(r=>r.sets===0);
  return {rows:under.concat(),under:under,over:over,infrequent:infrequent,untrained:untrained};
}

/* Is a reported effort value trustworthy enough to change the prescription?
   Requires either a large single deviation (2+ reps, non-novice) or the same
   direction twice running. Novices misjudge RIR by 1-2 reps, so they need the
   repeated signal before it is allowed to move load. */
function rirTrust(rir,prev,want){
  if(rir===null||rir===undefined)return {ok:false,why:'no effort logged'};
  const d=rir-want;
  if(d===0)return {ok:false,why:'effort was exactly on target'};
  const lvl=prof().level;
  if(Math.abs(d)>=2&&lvl!=='novice')return {ok:true,why:'a decisive effort reading'};
  const pd=(prev&&typeof prev.rir==='number')?prev.rir-want:null;
  if(pd!==null&&Math.abs(pd)>=1&&((pd>0)===(d>0)))
    return {ok:true,why:'the same effort signal appeared two sessions running'};
  return {ok:false,why:'one effort reading is inside its own error — wait for the signal to repeat'};
}
/* Autoregulated next-load prescription.
   Double progression sets the direction; reported effort (RIR) sets the size.
   The reading used is entryRir() — the HARDEST working set of last session,
   because that is how close to failure the session actually got. On records
   written before per-set effort existed it resolves to the exercise-level value,
   so nothing already logged changes meaning.
   Guardrails from the evidence: never move more than 10% in one session, damp a
   second consecutive increase to 60% of the computed change, and require the
   same easy signal twice before allowing more than a 5% jump. */
function nextLoad(exId){
  const ex=EXBY[exId],d=ex.def,L=latest(exId),want=prof().rir;
  if(!L)return {w:ex.bw?0:d.start,jump:0,rir:null,conf:null,note:'First time with this lift — start conservative and leave 2-3 reps in reserve.',why:'With no history the opening load is a guess you will correct within one session.'};
  if(ex.bw)return {w:0,jump:0,rir:null,conf:null,note:'Bodyweight — chase reps, not load.',why:'Without external load, adding reps is the only progression available.'};
  const sets=volSets(L.e.sets||[]).filter(s=>s.w>0);
  if(!sets.length)return {w:d.start,jump:0,rir:null,conf:null,note:'Log a weighted set and this becomes exact.',why:'No weighted sets recorded for this lift yet.'};
  const mx=Math.max.apply(null,sets.map(s=>s.w));
  const rir=entryRir(L.e);
  const h=exHistory(exId),prevS=h.length>=2?h[h.length-2]:null;
  /* A logged override wins for the day it was made: the user's call is data,
     not something to argue with. */
  if(S.over&&S.over[exId]===todayISO())
    return {w:mx,jump:0,rir:rir,conf:e1conf(mx,Math.max.apply(null,sets.map(s=>s.r)),rir),
      delta:null,trust:{ok:false,why:'you overrode this one'},override:true,from:mx,pct:0,
      note:'You chose to hold this load — recorded, and I will not argue.',
      why:'Overrides are kept as training data. Repeat the load deliberately and see how it feels.'};
  /* Effort is a SOFT input. A single RIR reading sits inside its own error
     (~1 rep, worse the further from failure and worse for novices), so it only
     steers the prescription when the signal is strong or has repeated. When it
     is not trustworthy the rep range alone decides, and we say so. */
  const trust=rirTrust(rir,prevS,want);
  const delta=trust.ok?(rir-want):null;
  const allTop=sets.every(s=>s.r>=d.max);
  const anyLow=sets.some(s=>s.r<d.min);
  let factor=1,note='',why='';
  if(allTop){
    if(delta!==null&&delta>=2){factor=1.075;note='Topped the range with '+rir+' still in reserve — take the double jump.';why='Every set reached '+d.max+' reps with effort to spare, so the load is well under your capacity.'}
    else if(delta!==null&&delta<=-1){factor=1+(d.inc/mx)*0.5;note='Topped the range but it cost you — smaller jump, rebuild the reps.';why='You hit the rep target close to maximal effort, so a full increment may not hold.'}
    else{factor=1+(d.inc/mx);note='Hit '+d.max+'s across — add '+fw(d.inc)+' '+wl()+' next time.';why='Every set reached the top of the rep range: that is the trigger to buy more weight.'}
  }else if(anyLow){
    if(delta!==null&&delta>=2){note='Reps fell but you had '+rir+' left — hold the load and actually push.';why='Missing the rep floor while reporting reserve effort suggests the sets ended early, not that the load is too heavy.'}
    else if(delta!==null&&delta<=-1){factor=0.95;note='Grinding and short of reps — back off about 5% and rebuild.';why='Maximal effort with missed reps is a fatigue signal, not a strength signal.'}
    else{note='Own the form · same load, chase the rep floor.';why='Technique before load — repeating the weight is the right move.'}
  }else{
    note='Same load · chase reps until every set reaches '+d.max+'.';
    why='You are inside the rep range, so reps are the cheapest progression available.';
  }
  /* an increase above 5% needs the same easy signal two sessions running */
  if(factor>1.05){
    const prevEasy=prevS&&prevS.rir!==null&&(prevS.rir-want)>=2;
    if(!prevEasy){factor=1.05;note='One clear jump this time — repeat it next session before going bigger.';why='A single easy session is weak evidence; two in a row is a pattern worth acting on.'}
  }
  /* damp a second consecutive increase */
  if(factor>1&&prevS&&prevS.top&&mx>prevS.top.w+0.001){
    const damped=mx+(mx*factor-mx)*0.6;
    factor=damped/mx;
  }
  factor=Math.max(0.90,Math.min(1.10,factor));
  const w=r125(mx*factor);
  return {w:w,jump:(w>mx?1:(w<mx?-1:0)),rir:rir,conf:e1conf(mx,Math.max.apply(null,sets.map(s=>s.r)),rir),
    delta:delta,trust:trust,note:note,why:why,from:mx,pct:mx?Math.round((w/mx-1)*1000)/10:0};
}
/* Warm-up ramp to a working load. Ramp sets stay well short of failure
   (RPE ~5-6) or they cost you the working sets they were meant to prepare. */
function warmupRamp(kg){
  if(!kg||kg<=0)return [];
  const steps=[[0.45,8],[0.62,5],[0.78,3],[0.88,2]];
  const out=[];let prev=0;
  steps.forEach(([p,r])=>{const w=r125(kg*p);if(w>prev&&w<kg){out.push({w:w,r:r});prev=w}});
  return out;
}
/* Session internal load (Foster-style): effort x duration. Reported as an
   index of your own trend, never as an absolute or a risk score. */
function sessionLoad(s,rpe){
  const mins=Math.max(1,Math.round((s.dur||0)/60));
  if(typeof s.rpe==='number')return s.rpe*mins;
  const mv=s.entries.reduce((a,e)=>a+volSets(e.sets).length,0);
  return Math.min(10,4+mv*0.35)*mins;   /* derived proxy when RPE was not logged */
}
function loadTrend(weeks){
  const n=weeks||6,wks=weekKeys(n),map={};
  wks.forEach(k=>map[k]={load:0,n:0});
  S.hist.forEach(s=>{const k=mondayOf(s.date);if(map[k]){map[k].load+=sessionLoad(s);map[k].n++}});
  return wks.map(k=>({week:k,load:Math.round(map[k].load),n:map[k].n}));
}
/* week-on-week change in volume load — a more defensible flag than ACWR */
function rampCheck(){
  const lt=loadTrend(4),cur=lt[lt.length-1],prev=lt[lt.length-2];
  if(!prev||!prev.load||!cur.load)return {pct:null,note:'not enough history'};
  const pct=(cur.load/prev.load-1)*100;
  return {pct:Math.round(pct),note:pct>30?'ramping fast':(pct<-30?'sharp drop':'steady')};
}
/* e1RM versus its own 28-day baseline: a >=3% drop is a readiness signal */
function e1Baseline(exId){
  const h=exHistory(exId);if(!h.length)return null;
  const cur=h[h.length-1],cut=addDays(todayISO(),-28);
  const prior=h.filter(p=>p.date>=cut&&p.date<cur.date);
  if(!prior.length)return null;
  const base=prior.reduce((a,p)=>a+p.e1,0)/prior.length;
  if(!base)return null;
  const pct=(cur.e1/base-1)*100;
  return {cur:cur.e1,base:base,pct:pct,drop:pct<=-3};
}

/* ================= COACH: DIAGNOSIS ================= */
/* Bodyweight lifts are scored on working reps only — summing every set let a
   warm-up ramp inflate the score and manufacture a "PR" that was just extra
   warm-up volume. Weighted lifts already went through bestE1(), which is
   kind-aware, so the two branches now agree. */
const scoreOf=en=>isBw(en.id)?volSets(en.sets).reduce((a,s)=>a+s.r,0):bestE1(en);
function allLifts(){const o={};S.hist.forEach(s=>s.entries.forEach(e=>{if(e.sets&&volSets(e.sets).length)o[e.id]=1}));return Object.keys(o)}
/* genuine PBs only: a first-ever session is a baseline, not a record */
function recentPRs(days){
  const cut=addDays(todayISO(),-(days||28)),out=[],best={};
  S.hist.slice().sort((a,b)=>(a.date<b.date?-1:1)).forEach(s=>{
    s.entries.forEach(en=>{
      if(!en.sets||!volSets(en.sets).length)return;
      const sc=scoreOf(en),prev=best[en.id]||0;
      if(s.date>=cut&&prev>0&&sc>prev+0.01)out.push({date:s.date,id:en.id,name:EXBY[en.id].n,score:sc,delta:sc-prev,bw:isBw(en.id)});
      if(sc>prev)best[en.id]=sc;
    });
  });
  return out.sort((a,b)=>(a.date<b.date?1:-1));
}
function readiness(){
  const last=S.hist.length?S.hist[S.hist.length-1]:null;
  const days=last?Math.max(0,Math.round((new Date(todayISO()+'T00:00:00')-new Date(last.date+'T00:00:00'))/864e5)):null;
  const ac=acwr();
  let level='green',label='Ready to push',msg='';
  if(days===null){level='grey';label='No data yet';msg='Log a session and this becomes your training dashboard.'}
  else if(ac.ratio!==null&&ac.ratio>1.5){level='red';label='Back off';msg='You have stacked volume faster than you have recovered from it.'}
  else if(days===0){level='amber';label='Trained today';msg='Already trained. Recovery is where the adaptation happens.'}
  else if(days<=1){level='green';label='Fresh';msg='A day or less since your last session.'}
  else if(days<=3){level='green';label='Ready to push';msg=days+' days since your last session — a good window to train hard.'}
  else{level='amber';label='Returning';msg=days+' days since your last session. Expect some detraining; do not chase old numbers on day one.'}
  return {level:level,label:label,msg:msg,days:days,acwr:ac};
}
/* Deload is a SUGGESTION, never automatic, and deliberately mild. The evidence
   for scheduled deloading is weak (the best RCT found continuous training
   marginally ahead on strength and readiness), while real-world practice cuts
   volume only 0-25% and keeps frequency unchanged. So this offers a one-week
   experiment with a defined end — not a prescription, and never a 50% cut. */
function deloadCheck(){
  const lifts=allLifts().map(liftReport).filter(l=>l.n>=3&&l.stall&&l.stall.enough);
  const flat=lifts.filter(l=>l.stall.flat);
  const rc=rampCheck(),reasons=[];
  if(flat.length>=3)reasons.push(flat.length+' lifts show no measurable progress at the same time.');
  else if(flat.length===2)reasons.push('Two lifts show no measurable progress together.');
  if(rc.pct!==null&&rc.pct>30)reasons.push('Your volume load rose '+rc.pct+'% week on week.');
  return {suggest:reasons.length>0,reasons:reasons,flat:flat,
    plan:'One lighter week: cut sets by about 20% (not half), keep the same exercises and the same training frequency — do not drop sessions — and let effort drift to 3-4 reps in reserve.',
    caveat:'Deloading is widespread practice but is not established by trials — treat it as a one-week experiment with a defined end, not a rule.'};
}
function diagnose(){
  const g=volumeGaps(),ac=acwr(),rd=readiness(),dl=deloadCheck(),pf=prof();
  const stalls=allLifts().map(liftReport).filter(l=>l.stall&&l.stall.stalled).sort((a,b)=>b.stall.since-a.stall.since);
  const bal=balance(),adh=adherence(4),actions=[];
  if(dl.suggest)actions.push({tone:'warn',icon:'M12 8v5M12 16.5v.5',title:'Consider a lighter week',
    detail:dl.reasons.join(' ')+' '+dl.plan,why:dl.caveat});
  const unt=g.untrained;
  if(unt.length)actions.push({tone:'warn',icon:'M12 5v14M5 12h14',title:'No work logged for '+unt.slice(0,3).map(u=>u.n).join(', '),
    detail:'Zero working sets in the last 7 days.',why:'A muscle you never train cannot grow, however hard you train the rest.'});
  const under=g.under.filter(u=>u.sets>0);
  if(under.length)actions.push({tone:'',icon:'M12 19V5M5 12l7-7 7 7',title:'Add volume to '+under.slice(0,3).map(u=>u.n).join(', '),
    detail:under.slice(0,3).map(u=>u.n+' '+u.sets+' vs '+u.lm[0]+' minimum').join(' · '),why:'Below the minimum effective volume a muscle is roughly maintaining, not growing.'});
  if(g.infrequent.length)actions.push({tone:'',icon:'M4 12h16M4 6h16M4 18h10',title:'Train '+g.infrequent.slice(0,3).map(u=>u.n).join(', ')+' twice a week',
    detail:'Trained hard, but only once in the last 7 days.',why:'At equal weekly volume, splitting it across 2+ sessions generally grows more muscle than one big session.'});
  if(g.over.length)actions.push({tone:'gold',icon:'M12 9v4M12 17v.5',title:g.over.map(u=>u.n).join(', ')+' past recoverable volume',
    detail:g.over.map(u=>u.n+' '+u.sets+' vs '+u.lm[2]+' ceiling').join(' · '),why:'Past the point you can recover from, extra sets cost recovery and buy nothing.'});
  if(stalls.length)actions.push({tone:'warn',icon:'M12 8v5M12 16.5v.5',title:stalls.length+' lift'+(stalls.length>1?'s':'')+' stalled',
    detail:stalls.slice(0,4).map(l=>l.name+' · flat '+l.stall.since+' sessions').join(' · '),why:'A stall is information. Fix recovery first, then volume, then exercise choice — grinding harder is last.'});
  if(adh.avg<pf.days-0.5)actions.push({tone:'',icon:'M8 2v4M16 2v4M3 10h18',title:'Consistency is the current limiter',
    detail:'Averaging '+adh.avg.toFixed(1)+' sessions a week against a target of '+pf.days+'.',why:'How often you train predicts progress more reliably than any program detail.'});
  const prs=recentPRs(28);
  if(prs.length)actions.push({tone:'',icon:'M4 12.5 9.5 18 20 6.5',title:prs.length+' personal best'+(prs.length>1?'s':'')+' in 4 weeks',
    detail:prs.slice(0,3).map(p=>p.name).join(' · '),why:'Evidence the plan is working — change nothing until it stops.'});
  return {g:g,acwr:ac,readiness:rd,deload:dl,stalls:stalls,balance:bal,adherence:adh,prs:prs,actions:actions};
}

/* ================= CONFIDENCE & GUARDRAILS =================
   Every recommendation is gated on how much data actually exists. Saying
   "I don't know yet" is what makes the confident answers credible. */
function confidence(){
  const sessions=S.hist.length;
  const days=sessions?Math.round((new Date(todayISO()+'T00:00:00')-new Date(S.hist[0].date+'T00:00:00'))/864e5):0;
  /* A session counts as effort-verified when ANY of its sets carries a reading —
     per-set effort, or the exercise-level value an older record has. */
  const withRir=S.hist.filter(s=>s.entries.some(e=>entryRir(e)!==null)).length;
  const rirPct=sessions?Math.round(withRir/sessions*100):0;
  let level,label,msg;
  if(sessions<3){level='calibrating';label='Calibrating';msg='Your first sessions are setting the baseline. Treat everything below as provisional.'}
  else if(sessions<10){level='low';label='Early read';msg=sessions+' sessions in — enough for working loads and set counts, not yet for trends.'}
  else if(sessions<30){level='moderate';label='Building';msg=sessions+' sessions in. Trends are meaningful; stall calls are still early.'}
  else{level='solid';label='Solid';msg=sessions+' sessions across '+days+' days. The engine can responsibly suggest changing your plan on this.'}
  return {level:level,label:label,msg:msg,sessions:sessions,days:days,rirPct:rirPct,lifts:allLifts().length};
}
/* Injury guardrail: a flagged area is routed around, never trained through.
   This is the one place the app deliberately withholds a recommendation. */
function avoided(id){
  const inj=prof().injuries||[];
  if(!inj.length)return false;
  const ex=EXBY[id];
  return !!(ex&&inj.indexOf(ex.g)>=0);
}
function avoidedNames(){return prof().injuries||[]}

   +'<span class="voltrack"><span class="volfill" style="width:'+w.toFixed(1)+'%;background:'+col+'"></span>'
   +(r.lm?'<span class="volmark" style="left:'+mark.toFixed(1)+'%" title="productive target '+(r.lm?r.lm[1]:'')+' sets"></span>':'')+'</span>'

   +'<div class="stat"><div class="sv">'+d.adherence.avg.toFixed(1)+'</div><div class="sl">Sessions / week</div><div class="sd">target '+pf.days+'</div></div>'
   +'<div class="stat"><div class="sv">'+d.prs.length+'</div><div class="sl">PBs · 4 weeks</div><div class="sd '+(d.prs.length?'up':'flat')+'">'+(d.prs.length?'progressing':'none yet')+'</div></div></div>';
  /* next session */
  h+='<div class="sect"><div class="sect-h"><span class="sect-t">Do this next</span><span class="sect-s">'+next.next.label+'</span></div>'
   +'<div class="card"><div style="font-size:12px;color:var(--dim);margin-bottom:6px">'+esc(next.split.name)+' · session '+(next.idx+1)+' of '+next.split.days.length+'</div>'
   +rxRows(next.next.rid)
   +'<button class="btn btn-pri btn-block" style="margin-top:12px" onclick="G.startNext()">Start '+esc(next.next.label)+'</button></div>';
  const ramp=warmupRamp((ROUTINES[next.next.rid].ex.map(p=>nextLoad(p.id).w).filter(w=>w>0)[0])||0);
  if(ramp.length)h+='<div style="font-size:11.5px;color:var(--dim);margin-top:8px;text-align:center">Warm-up to your first working weight: '
   +ramp.map(r=>fw(r.w)+'×'+r.r).join(' → ')+'</div>';
  h+='</div>';
  /* volume audit */
  const rows=d.g.rows;
  h+='<div class="sect"><div class="sect-h"><span class="sect-t">Weekly volume audit</span><span class="sect-s">last 7 days · sets vs target</span></div>'
   +'<div class="card">'+rows.map(volRow).join('')+'</div>'
   +'<div style="font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:9px">Targets scale with your experience level (<b>'+esc(pf.level)+'</b>) and your goal (<b>'+esc((GOALS.filter(g=>g.v===pf.goal)[0]||GOALS[0]).n)+'</b>), which sets where in the band a week is graded. '
   +'Primary muscles count a full set, assisting muscles half. Markers show the productive target.</div></div>';
  /* coaching actions */
  if(d.actions.length){
    h+='<div class="sect"><div class="sect-h"><span class="sect-t">What to change</span><span class="sect-s">'+d.actions.length+' item'+(d.actions.length>1?'s':'')+'</span></div>'
     +'<div class="card">'+d.actions.map(a=>'<div class="advice"><span class="advico '+a.tone+'"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="'+a.icon+'"/></svg></span>'
     +'<div><h4>'+esc(a.title)+'</h4><p>'+esc(a.detail)+'</p><div class="why">'+esc(a.why)+'</div></div></div>').join('')+'</div></div>';
  }
  /* balance */
  h+='<div class="sect"><div class="sect-h"><span class="sect-t">Balance</span><span class="sect-s">last 4 weeks</span></div><div class="card">'
   +d.balance.map(b=>'<div class="kv"><span class="k">'+b.label+'</span><span class="v">'+(b.ratio===null?'—':b.ratio.toFixed(2)+' : 1')+' <span style="color:var(--dim);font-weight:600">· '+b.note+'</span></span></div>').join('')
   +'<div style="font-size:11.5px;color:var(--dim);line-height:1.5;margin-top:9px">This is how your volume happens to be distributed — nothing more. No target ratio for trained lifters is scientifically established, so treat a wide gap as an observation worth a look, not a diagnosis.</div></div></div>';
  /* stalls detail */
  if(d.stalls.length){
    h+='<div class="sect"><div class="sect-h"><span class="sect-t">Stalled lifts</span><span class="sect-s">intervention order</span></div><div class="card">'
     +d.stalls.slice(0,6).map(l=>'<div class="kv"><span class="k">'+esc(l.name)+'</span><span class="v">flat '+l.stall.since+' sessions</span></div>').join('')
     +'<div style="font-size:12px;color:var(--mut);line-height:1.6;margin-top:10px">Work down this list rather than jumping to the bottom: <b>1</b> sleep, food and stress · <b>2</b> a deload if several lifts stalled at once · <b>3</b> more or better-distributed volume · <b>4</b> a technique check · <b>5</b> swap the variation.</div></div></div>';
  }
  h+='<div class="disc">General training information, not medical advice. Targets are evidence-informed starting points, not measurements of you — adjust with how you actually recover. Stop and seek a professional if something hurts.</div>';
  return h;
}

/* ================= TECHNIQUE DEMOS =================
   ONE rig, 48 demonstrations, zero network and zero downloaded media.

   WHY IT IS BUILT THIS WAY
   The demos this replaces were 19 generic stick figures shared across 48
   exercises, so most of the library showed the wrong movement (the skullcrusher
   played the standing pushdown, the hip thrust played a standing hip hinge).
   Form was guessed as raw pixel coordinates, which is why the limbs did not
   bend like limbs.

   This rig fixes both problems at the source:

     * ONE skeleton, ONE set of bone lengths, ONE 200x200 canvas, ONE palette,
       ONE set of stroke weights and ONE four-phase tempo, shared by every
       exercise. Only the pose and the apparatus change, so the whole library is
       uniform by construction and proportions cannot drift exercise to exercise.

     * A pose is authored as the few things a coach actually says out loud — where
       the pelvis is, which way the spine points, where the hands and feet are,
       and which way each elbow and knee bends. Elbows and knees are then placed
       by real two-link inverse kinematics, so joints bend like joints and the
       load travels a controlled path instead of a guessed arc.

   ONE REP, SAME TEMPO, EVERY EXERCISE:
       home -> away 1500ms | hold 320 | away -> home 1000ms | hold 320
   "home" is ALWAYS the shortened-muscle position and "away" is ALWAYS the
   lengthened one, so phase 1 is always the controlled lowering and phase 3 is
   always the drive — in all 48 exercises, without exception.
*/
const D2R=Math.PI/180;
const DEG=d=>d*D2R;
const nf=v=>Math.round(v*10)/10;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>t*t*(3-2*t);

/* CSS variables are read once per draw so all six themes work, with fallbacks so
   a missing variable can never emit an empty colour into the SVG. */
function cssVar(name,fb){
  let v='';
  try{v=getComputedStyle(document.documentElement).getPropertyValue(name).trim()}catch(e){}
  return v||fb;
}
const ACC=()=>cssVar('--volt','#cbf33a');
const DIMC=()=>cssVar('--dim','#5f6873');
const L2C=()=>cssVar('--line2','#30353e');
const INKC=()=>cssVar('--ink','#f2f4f7');
const BGC=()=>cssVar('--bg2','#0a0b0d');
/* Apparatus is dimmer than the body but must still be legible: the first pass sat
   so far into the background that benches and pads read as empty space. */
const PADC=()=>'color-mix(in srgb,var(--line2) 92%,transparent)';
const FRAMEC=()=>'color-mix(in srgb,var(--dim) 62%,transparent)';

/* ---------- drawing helpers: every scene and the body share these, which is
   exactly what keeps the illustration style identical exercise to exercise ---- */
const style=o=>{let s='';for(const k in o)s+=k+':'+o[k]+';';return s};
const ln=(a,b,s)=>'<line x1="'+nf(a[0])+'" y1="'+nf(a[1])+'" x2="'+nf(b[0])+'" y2="'+nf(b[1])+'" style="'+s+'" stroke-linecap="round"/>';
const cir=(p,r,s)=>'<circle cx="'+nf(p[0])+'" cy="'+nf(p[1])+'" r="'+nf(r)+'" style="'+s+'"/>';
const rect=(x,y,w,h,r,s)=>'<rect x="'+nf(x)+'" y="'+nf(y)+'" width="'+nf(w)+'" height="'+nf(h)+'" rx="'+nf(r)+'" style="'+s+'"/>';

/* ---------- THE ONE SKELETON (shared by all 48 demos) ----------
   Derived from a 180 cm athlete scaled to this canvas, not guessed:
     hip joint 95 cm, shoulder joint 145 cm, wrist 85 cm, knee 50 cm, ankle 8 cm,
     head centre 166 cm, head half-height 11.5 cm.
   Scaled by 130/180 = 0.722 that gives the numbers below. Getting these right is
   what makes the limbs bend like limbs and stops a hand target from being
   unreachable — the first draft had a torso 8 units too long and a forearm 5 too
   long, which alone made 742 authored hand and foot positions impossible. */
const BONE={head:8.4,neck:6.5,torso:36,upper:24,fore:19.5,thigh:32.5,shin:30.3,foot:9};
const GY=182;                                   /* the floor */
const HIPY=GY-(BONE.thigh+BONE.shin);           /* hip with straight legs ~119 */

/* Near/far separation used to fake depth in a side view and shoulder width in a
   front view. Keyed by VIEW only, so every side view is framed identically. */
const VIEW={side:{sh:2.8,hip:2.4},front:{sh:9.5,hip:5.5}};

/* ---------- TWO-LINK INVERSE KINEMATICS ----------
   Places an elbow or a knee so that |a->joint| = l1 and |joint->b| = l2, choosing
   between the two mirror solutions by which side the pole points to. The target
   is clamped into reach, so a pose can never silently produce a hyperextended
   limb or a NaN. The clamped case is reported via the returned `over` flag so a
   test can catch an unreachable pose instead of it becoming a visual bug. */
function ik(a,b,l1,l2,poleDeg){
  const dx=b[0]-a[0],dy=b[1]-a[1];
  let d=Math.hypot(dx,dy);
  if(!isFinite(d)||d<1e-6)d=1e-6;
  const dmax=l1+l2-0.02, dmin=Math.abs(l1-l2)+0.02;
  const over=(d>dmax+1e-6)||(d<dmin-1e-6);
  const dc=Math.min(dmax,Math.max(dmin,d));
  const base=Math.atan2(dy,dx);
  let cosA=(l1*l1+dc*dc-l2*l2)/(2*l1*dc);
  cosA=Math.min(1,Math.max(-1,cosA));
  const A=Math.acos(cosA);
  const j1=[a[0]+Math.cos(base+A)*l1,a[1]+Math.sin(base+A)*l1];
  const j2=[a[0]+Math.cos(base-A)*l1,a[1]+Math.sin(base-A)*l1];
  const pr=DEG(poleDeg),px=Math.cos(pr),py=Math.sin(pr);
  const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
  const s1=(j1[0]-mx)*px+(j1[1]-my)*py;
  const s2=(j2[0]-mx)*px+(j2[1]-my)*py;
  return{j:s1>=s2?j1:j2,over:over};
}

/* ---------- POSE ----------
   A pose names: pelvis position, spine direction, head direction, the two hand
   positions and the two foot positions. Limb lengths and joint bend directions
   belong to the EXERCISE, not the phase, and come from the demo definition. */
/* Angles are interpolated along the SHORTEST path. A plain numeric lerp is fine
   for a pose that barely rotates, but a spine going from 180 to -151 degrees (a
   bridge or a hip thrust lowering) would otherwise spin the athlete forwards
   through zero and back, folding the body inside out halfway through the rep. */
function lerpAng(a,b,u){
  let d=((b-a+540)%360)-180;
  return a+d*u;
}
function mixPose(a,b,u){
  const m=(ka,kb)=>[lerp(ka[0],kb[0],u),lerp(ka[1],kb[1],u)];
  return{
    hip:m(a.hip,b.hip),
    torso:lerpAng(a.torso,b.torso,u),
    head:lerpAng(a.head,b.head,u),
    wrN:m(a.wrN,b.wrN),wrF:m(a.wrF,b.wrF),
    anN:m(a.anN,b.anN),anF:m(a.anF,b.anF),
    toeN:lerp(a.toeN,b.toeN,u),toeF:lerp(a.toeF,b.toeF,u)
  };
}
/* Resolve a pose into every drawable joint.
   ONE inverse-kinematics solve per limb, taken from the JOINT CENTRE. The near/far
   separation is applied afterwards, as a rigid shift while drawing — which is how a
   2D illustration fakes depth. It must not change what a limb can reach: on the
   first pass the offset was fed into the solver, so a perfectly symmetric two-hand
   grip came out reachable on the near side and impossible on the far side, which is
   what produced most of the unreachable-limb reports. */
function solve(pose,d,demo){
  const over=[];
  const V=VIEW[demo.view]||VIEW.side;
  const tr=DEG(pose.torso);
  const nx=-Math.sin(tr),ny=Math.cos(tr);
  const hip=pose.hip;
  const sh=[hip[0]+Math.cos(tr)*BONE.torso,hip[1]+Math.sin(tr)*BONE.torso];
  const sx=nx*V.sh, sy=ny*V.sh, hx=nx*V.hip, hy=ny*V.hip;
  const hd=DEG(pose.head);
  const neck=[sh[0]+Math.cos(hd)*BONE.neck,sh[1]+Math.sin(hd)*BONE.neck];
  const head=[neck[0]+Math.cos(hd)*BONE.head*0.94,neck[1]+Math.sin(hd)*BONE.head*0.94];
  const eN=ik(sh,pose.wrN,BONE.upper,BONE.fore,demo.poleElbN); if(eN.over)over.push('elbN');
  const eF=ik(sh,pose.wrF,BONE.upper,BONE.fore,demo.poleElbF); if(eF.over)over.push('elbF');
  const kN=ik(hip,pose.anN,BONE.thigh,BONE.shin,demo.poleKneeN); if(kN.over)over.push('knN');
  const kF=ik(hip,pose.anF,BONE.thigh,BONE.shin,demo.poleKneeF); if(kF.over)over.push('knF');
  const mv=(p,s)=>[p[0]+s[0],p[1]+s[1]];
  const S=[sx,sy],Sm=[-sx,-sy],H=[hx,hy],Hm=[-hx,-hy];
  const toN=mv([pose.anN[0]+Math.cos(DEG(pose.toeN))*BONE.foot,pose.anN[1]+Math.sin(DEG(pose.toeN))*BONE.foot],H);
  const toF=mv([pose.anF[0]+Math.cos(DEG(pose.toeF))*BONE.foot,pose.anF[1]+Math.sin(DEG(pose.toeF))*BONE.foot],Hm);
  return{
    hip:hip,sh:sh,torso:pose.torso,
    shN:mv(sh,S),shF:mv(sh,Sm),hpN:mv(hip,H),hpF:mv(hip,Hm),
    neck:neck,head:head,
    elN:mv(eN.j,S),wrN:mv(pose.wrN,S),
    elF:mv(eF.j,Sm),wrF:mv(pose.wrF,Sm),
    knN:mv(kN.j,H),anN:mv(pose.anN,H),toN:toN,
    knF:mv(kF.j,Hm),anF:mv(pose.anF,Hm),toF:toF,
    over:over
  };
}
/* Normalise the authoring shorthand: `wr`/`an` set both sides at once. A pose may
   also override the foot angle, which a calf raise needs: the ball of the foot
   stays on the step while the heel travels. */
function normPose(p){
  return{
    hip:p.hip,torso:p.torso,head:p.head===undefined?p.torso-180:p.head,
    wrN:p.wrN||p.wr,wrF:p.wrF||p.wr,
    anN:p.anN||p.an,anF:p.anF||p.an,
    toeN:p.toeN,toeF:p.toeF
  };
}

/* ---------- TEMPO: identical for all 48 ---------- */
const TEMPO=[['ecc',1500],['hold',320],['con',1000],['hold',320]];
const CYCLE=TEMPO.reduce((a,x)=>a+x[1],0);
/* t in [0,1) -> which phase and how far from home toward away (mix 0..1) */
function stageAt(t){
  let u=t-Math.floor(t);
  if(!isFinite(u)||u<0)u=0;
  let ms=u*CYCLE,i=0;
  while(i<TEMPO.length-1&&ms>=TEMPO[i][1]){ms-=TEMPO[i][1];i++}
  const f=Math.min(1,Math.max(0,ms/TEMPO[i][1]));
  if(i===0)return{mix:smooth(f),ph:'away'};
  if(i===1)return{mix:1,ph:'holdAway'};
  if(i===2)return{mix:1-smooth(f),ph:'home'};
  return{mix:0,ph:'holdHome'};
}

/* ---------- APPARATUS ----------
   A deliberately small kit of parts, reused by every scene, so a pad looks like a
   pad and a cable stack looks like a cable stack throughout the whole library. */
function padAt(cx,cy,len,th,ang){
  return '<g transform="translate('+nf(cx)+' '+nf(cy)+') rotate('+nf(ang)+')">'
    +rect(-len/2,-th/2,len,th,th/2,style({fill:PADC(),stroke:L2C(),'stroke-width':1.6}))
    +'</g>';
}
function post(x,yTop,yBot,w){
  return rect(x-(w||3)/2,yTop,(w||3),yBot-yTop,2,style({fill:L2C(),opacity:.7}));
}
function frameRect(x,y,w,h,r){
  return rect(x,y,w,h,r||4,style({fill:FRAMEC(),stroke:L2C(),'stroke-width':2.2}));
}
function groundLine(y,from,to){
  return ln([from===undefined?0:from,y],[to===undefined?200:to,y],style({stroke:DIMC(),'stroke-width':3,opacity:.55}));
}
function plate(p,r){
  return cir(p,r,style({fill:ACC(),opacity:.9}))+cir(p,r*0.42,style({fill:BGC(),opacity:.55}));
}
/* Barbell, drawn the conventional way: a bar with a plate at each end. */
function barAt(p,half,thick){
  const h=half||30,w=thick||4.2;
  let s=ln([p[0]-h,p[1]],[p[0]+h,p[1]],style({stroke:ACC(),'stroke-width':w}));
  s+=plate([p[0]-h-1,p[1]],6)+plate([p[0]+h+1,p[1]],6);
  return s;
}
/* A bar with no plates: a lat pulldown or a cable bar carries its load through the
   cable, so drawing plates on it would be wrong. */
function barPlain(p,half,thick){
  const h=half||26,w=thick||3.6;
  return ln([p[0]-h,p[1]],[p[0]+h,p[1]],style({stroke:ACC(),'stroke-width':w}))
    +ln([p[0]-h,p[1]-5],[p[0]-h,p[1]+5],style({stroke:ACC(),'stroke-width':3}))
    +ln([p[0]+h,p[1]-5],[p[0]+h,p[1]+5],style({stroke:ACC(),'stroke-width':3}));
}
/* Dumbbell, drawn end-on at an angle so it reads as a bell in the hand. */
function dbAt(p,ang,sc){
  const k=sc||1,a=ang===undefined?-24:ang;
  return '<g transform="translate('+nf(p[0])+' '+nf(p[1])+') rotate('+nf(a)+') scale('+k+')">'
    +ln([-7,0],[7,0],style({stroke:DIMC(),'stroke-width':3.4}))
    +rect(-11,-5,4.5,10,1.6,style({fill:ACC(),opacity:.92}))
    +rect(6.5,-5,4.5,10,1.6,style({fill:ACC(),opacity:.92}))
    +'</g>';
}
/* Cable stack + pulley, so every cable exercise shows where the load comes from. */
function stackAt(x,base,top){
  let s=frameRect(x-13,top,26,base-top,5);
  for(let y=top+9;y<base-8;y+=7)s+=ln([x-9,y],[x+9,y],style({stroke:L2C(),'stroke-width':1.6,opacity:.75}));
  return s;
}
function pulley(p){
  return cir(p,4,style({fill:FRAMEC(),stroke:L2C(),'stroke-width':1.8}));
}
function cableTo(a,b){
  return ln(a,b,style({stroke:DIMC(),'stroke-width':1.6,opacity:.85}));
}
/* A plate-loaded machine: a weight stack, the upright beside it, a base plate, the
   seat under the glutes, and the pad the athlete is braced against. Deliberately
   compact — an earlier version outlined a frame around the whole canvas, which read
   as a picture frame with a person inside it rather than as a machine. */
function machineAt(P,o){
  o=o||{};
  const px=P.hip[0]+(o.postDx===undefined?-48:o.postDx);
  const seatX=P.hip[0]+(o.seatDx===undefined?8:o.seatDx);
  const seatY=P.hip[1]+9;
  return stackAt(px,GY,104)
    +frameRect(px+26,74,14,GY-74,4)
    +rect(P.hip[0]-34,GY-9,88,9,3,style({fill:PADC(),stroke:L2C(),'stroke-width':1.6}))
    +post(seatX,seatY+7,GY,4)+padAt(seatX,seatY,42,11,0)
    +(o.chest?chestPad(P,42,13):backPad(P,o.padLen||46,12))
    +groundLine(GY);
}
/* The pad the athlete's back is pinned against, drawn FROM the spine line so it
   stays behind the back at every point in the rep. +normal is the front of the
   body, so the back pad sits at -normal. */
function backPad(P,len,off){
  const tr=DEG(P.torso),nx=-Math.sin(tr),ny=Math.cos(tr),o=off===undefined?11:off;
  const cx=(P.hip[0]+P.sh[0])/2-nx*o, cy=(P.hip[1]+P.sh[1])/2-ny*o;
  return padAt(cx,cy,len||46,11,P.torso);
}
/* The pad the athlete's chest is pressed into — the mirror of backPad. */
function chestPad(P,len,off){
  const tr=DEG(P.torso),nx=-Math.sin(tr),ny=Math.cos(tr),o=off===undefined?11:off;
  const cx=(P.hip[0]+P.sh[0])/2+nx*o, cy=(P.hip[1]+P.sh[1])/2+ny*o;
  return padAt(cx,cy,len||40,11,P.torso);
}

/* ---------- SCENES ----------
   Each returns the apparatus split into what sits behind the athlete and what
   sits in front of them, so the body can be sandwiched correctly. Everything is
   derived from the athlete's own joints wherever it can be, which stops the
   equipment from floating away from the body. */
const SCENES={
  floor:()=>({back:groundLine(GY),front:''}),

  /* Flat bench, positioned from the athlete's own spine line. */
  benchFlat:(P)=>({back:padAt((P.hip[0]+P.sh[0])/2,(P.hip[1]+P.sh[1])/2+7,Math.abs(P.hip[0]-P.sh[0])+30,10,0)
    +post(P.hip[0]+8,P.sh[1]+12,GY,5)+post(P.sh[0]-6,P.sh[1]+12,GY,5)
    +groundLine(GY),front:''}),

  benchIncline:(P)=>{
    const cx=(P.hip[0]+P.sh[0])/2,cy=(P.hip[1]+P.sh[1])/2;
    return{back:padAt(cx,cy+7,50,10,P.torso)+post(cx+6,cy+14,GY,5)+post(cx-14,cy+10,GY,5)
      +padAt(P.hip[0]+18,P.hip[1]+10,30,10,0)+groundLine(GY),front:''};
  },

  benchUpright:(P)=>{
    const cx=(P.hip[0]+P.sh[0])/2,cy=(P.hip[1]+P.sh[1])/2;
    return{back:padAt(cx-2,cy+7,50,10,P.torso)+padAt(P.hip[0]+20,P.hip[1]+10,30,10,0)
      +post(cx,cy+16,GY,5)+post(P.hip[0]+20,P.hip[1]+16,GY,5)+groundLine(GY),front:''};
  },

  /* Squat rack: two uprights + J-hooks, placed behind the shoulder line. */
  rack:(P)=>{
    const x=P.sh[0];
    return{back:frameRect(x+26,24,7,GY-24,3)+frameRect(x-46,24,7,GY-24,3)
      +ln([x+20,x+62],[P.sh[1]+6,P.sh[1]+6],style({stroke:L2C(),'stroke-width':3,opacity:.8}))
      +groundLine(GY),front:''};
  },

  /* Overhead bar pinned to the HANDS, so the grip can never float off it. */
  pullupBar:(P)=>{const y=P.wrN[1];
    return{back:ln([P.wrN[0]-40,y],[P.wrN[0]+46,y],style({stroke:L2C(),'stroke-width':4.5}))

/* ---------- THE BODY ----------
   A filled mannequin, not a stick figure: capsule limbs at real thicknesses, a
   shoulder line and a hip line so the torso reads as a body with depth, joint
   dots so a learner can see which joints are working, and the far-side limbs
   drawn dimmed and first so the near side occludes them correctly. */
function boneLine(a,b,w,op){
  return ln(a,b,style({stroke:INKC(),'stroke-width':w,'stroke-linecap':'round',opacity:op===undefined?1:op}));
}
function dot(p,r,op){return cir(p,r||2.3,style({fill:INKC(),opacity:op||.5}))}
function drawBody(P){
  const f='.34';
  const far='<g opacity="'+f+'">'
    +boneLine(P.shF,P.elF,8)+boneLine(P.elF,P.wrF,7.2)
    +boneLine(P.hpF,P.knF,9.5)+boneLine(P.knF,P.anF,8)+boneLine(P.anF,P.toF,6.4)
    +'</g>';
  const core=boneLine(P.hip,P.sh,14)+boneLine(P.hpF,P.hpN,11)+boneLine(P.shF,P.shN,10);
  const near=boneLine(P.shN,P.elN,8.6)+boneLine(P.elN,P.wrN,7.6)
    +boneLine(P.hpN,P.knN,10)+boneLine(P.knN,P.anN,8.4)+boneLine(P.anN,P.toN,6.6);
  const joints=dot(P.elN)+dot(P.knN)+dot(P.shN)+dot(P.hpN)+dot(P.elF)+dot(P.knF);
  const head=cir(P.head,BONE.head,style({fill:INKC()}));
  return far+core+near+head+joints;
}
/* One call draws a complete frame: apparatus behind, body, apparatus in front,
   then the load. Uniform layer order for all 48. */
function drawFigure(d,P,load){
  const sc=(SCENES[d.scene]||SCENES.floor)(P,d);
  return sc.back+drawBody(P)+(sc.front||'')+(load||'');
}
/* The load, attached to the part of the body that actually carries it — the
   hands by default, the hips for a hip thrust, the feet for a leg press.
   Two dumbbells are drawn in a side view, so the far one is scaled down and dimmed
   rather than laid exactly over the near one — otherwise a symmetric press renders
   as one confusing blob at the hands. */
function loadFor(d,P){
  const L=d.load;
  if(!L)return'';
  const at=d.loadAt==='hip'?[P.hip[0],P.hip[1]-9]:(d.loadAt==='foot'?P.anN:P.wrN);
  if(L==='bar')return barAt(at,L.half||30);
  if(L==='pullbar')return barPlain(at,L.half||26);
  if(L==='db')return '<g opacity=".55">'+dbAt(P.wrF,L.ang,(L.sc||1)*0.82)+'</g>'+dbAt(P.wrN,L.ang,L.sc);
  if(L==='db1')return dbAt(P.wrN,L.ang,L.sc);
  if(L==='plate')return plate(at,9);
  if(L==='handle')return ln(at,[at[0]+(L.len||14),at[1]],style({stroke:L2C(),'stroke-width':4}));
  return'';
}

/* ---------- THE DEMO TABLE -> ANIMS ----------
   ANIMS stays the name the regression suites read. It is now keyed by exercise
   id, one entry per exercise, and gen(t) returns the resolved joints for the
   fraction t of one rep. */
const DEMOS={};
const ANIMS={};
/* Fill in the joint bend directions. In a FRONT view the far side is mirrored
   about the vertical axis, which keeps left and right symmetrical without every
   front-view exercise having to state both sides by hand. */
function normDemo(d){
  const front=d.view==='front';
  d.poleElbN=(d.poleN&&d.poleN.elb!==undefined)?d.poleN.elb:d.pole.elb;
  d.poleElbF=(d.poleF&&d.poleF.elb!==undefined)?d.poleF.elb:(front?180-d.poleElbN:d.pole.elb);
  d.poleKneeN=(d.poleN&&d.poleN.knee!==undefined)?d.poleN.knee:d.pole.knee;
  d.poleKneeF=(d.poleF&&d.poleF.knee!==undefined)?d.poleF.knee:(front?180-d.poleKneeN:d.pole.knee);
  const t=d.toe===undefined?0:d.toe;
  d.toeN=d.toeN===undefined?t:d.toeN;
  d.toeF=d.toeF===undefined?(front?180-d.toeN:t):d.toeF;
  return d;
}
/* Keep an interpolated hand or foot target inside what the limb can actually
   reach. Between two authored extremes the straight-line path can momentarily sit
   further from the joint than the limb is long; clamping then simply means "the
   arm is at full extension", which is what is physically happening. Note this is a
   mid-rep artefact of interpolating between two valid poses, NOT an authoring
   error — so _audit_demos.cjs still checks the authored extremes strictly, and
   also asserts that no rendered frame ever needs clamping. */
function fitTarget(joint,target,a,b){
  const dx=target[0]-joint[0],dy=target[1]-joint[1];
  const d=Math.hypot(dx,dy)||1e-6;
  const lo=Math.abs(a-b)+0.35,hi=a+b-0.35;
  if(d>=lo&&d<=hi)return target;
  const k=(d<lo?lo:hi)/d;
  return[joint[0]+dx*k,joint[1]+dy*k];
}
function jointsOf(p){
  const tr=DEG(p.torso);
  return{hip:p.hip,sh:[p.hip[0]+Math.cos(tr)*BONE.torso,p.hip[1]+Math.sin(tr)*BONE.torso]};
}
function buildAnims(){
  Object.keys(DEMOS).forEach(id=>{
    const d=normDemo(DEMOS[id]);
    d.home=normPose(d.home);d.away=normPose(d.away);
    /* a pose that does not name a foot angle inherits the exercise's */
    ['home','away'].forEach(k=>{
      if(d[k].toeN===undefined)d[k].toeN=d.toeN;
      if(d[k].toeF===undefined)d[k].toeF=d.toeF;
    });
    ANIMS[id]={
      label:d.label,
      gen:function(t){
        const s=stageAt(t);
        const p=mixPose(d.home,d.away,s.mix);
        const j=jointsOf(p);
        p.wrN=fitTarget(j.sh,p.wrN,BONE.upper,BONE.fore);
        p.wrF=fitTarget(j.sh,p.wrF,BONE.upper,BONE.fore);
        p.anN=fitTarget(j.hip,p.anN,BONE.thigh,BONE.shin);
        p.anF=fitTarget(j.hip,p.anF,BONE.thigh,BONE.shin);
        return solve(p,d,d);
      }
    };
  });
}

/* ---------- UNIFORM HUD ----------
   Identical markup and identical controls for every exercise: which phase the
   athlete is in, how far through the rep, a pause, and a frame step for studying
   a position. */
function demoHUD(id){
  const d=DEMOS[id];if(!d)return'';
  return '<div class="demohud">'
    +'<span class="demoph" id="demo-ph">'+d.ph[0]+'</span>'
    +'<span class="demotrack"><i id="demo-bar" style="width:0%"></i></span>'
    +'<button class="demobtn" id="demo-play" onclick="G.demoToggle()" aria-label="Pause or play this demonstration">PAUSE</button>'
    +'<button class="demobtn" onclick="G.demoStep()" aria-label="Step this demonstration forward one frame">STEP</button>'
    +'</div>'
    /* Same place, same label, same type scale for all 48 — this is what tells two
       look-alike movements apart (a chin-up and a pull-up differ only in the grip,
       which a side view cannot show). */
    +(d.setup?'<div class="demosetup"><b>SET UP</b><span>'+d.setup+'</span></div>':'');
}

/* ---------- THE LOOP ----------
   One rAF loop, one 200x200 viewBox, one tempo, for every exercise in the
   library. Honours prefers-reduced-motion by showing both extremes of the rep
   side by side instead of animating — a still comparison is the actual
   information for someone who cannot use motion. */
let demoPlay=true;
function reducedMotion(){
  try{return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches)}catch(e){return false}
}
function stageEl(){return document.getElementById('anim-stage')}
function drawFrame(el,id,t){
  const d=DEMOS[id];if(!d||!el)return;
  const P=ANIMS[id].gen(t);
  el.__g.innerHTML=drawFigure(d,P,loadFor(d,P));
  const ph=document.getElementById('demo-ph'),bar=document.getElementById('demo-bar');
  const s=stageAt(t);
  if(ph)ph.textContent=s.ph==='away'?d.ph[0]:(s.ph==='home'?d.ph[1]:'HOLD');
  if(bar)bar.style.width=Math.round((t-Math.floor(t))*100)+'%';
}
function renderStill(el,id){
  const d=DEMOS[id];if(!d||!el)return;
  const A=solve(d.home,d,d),B=solve(d.away,d,d);
  el.__g.innerHTML='<g transform="translate(2 28) scale(.44)">'+drawFigure(d,A,loadFor(d,A))+'</g>'
    +'<g transform="translate(102 28) scale(.44)">'+drawFigure(d,B,loadFor(d,B))+'</g>'
    +'<text x="24" y="16" style="fill:'+DIMC()+';font:700 11px Archivo,system-ui,sans-serif;letter-spacing:.08em">'+d.ph[0]+'</text>'
    +'<text x="124" y="16" style="fill:'+DIMC()+';font:700 11px Archivo,system-ui,sans-serif;letter-spacing:.08em">'+d.ph[1]+'</text>';
  const ph=document.getElementById('demo-ph'),bar=document.getElementById('demo-bar');
  if(ph)ph.textContent='STILL';
  if(bar)bar.style.width='100%';
}
function stopDemo(){
  const el=stageEl();
  if(el&&el.__raf)cancelAnimationFrame(el.__raf);
  if(el)el.__raf=0;
  /* The 3D view holds a WebGL context, which browsers cap (Chrome keeps ~16 alive and silently drops
     the oldest). Releasing it here means every close path — the backdrop, the Close button, opening
     another sheet — goes through one teardown instead of leaking a context per view. */
  if(el&&window.S3D_APP)S3D_APP.destroy(el);
}
function startAnimLoop(el,id){
  const NS='http://www.w3.org/2000/svg';
  if(!el||!DEMOS[id])return;
  if(el.__raf)cancelAnimationFrame(el.__raf);
  el.innerHTML='';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 200 200');
  svg.setAttribute('role','img');
  svg.setAttribute('aria-label',DEMOS[id].label+' technique demonstration');
  const g=document.createElementNS(NS,'g');
  svg.appendChild(g);el.appendChild(svg);
  el.__g=g;el.__id=id;
  demoPlay=true;
  const pb=document.getElementById('demo-play');if(pb)pb.textContent='PAUSE';
  if(reducedMotion()){renderStill(el,id);return}
  let t0=null;
  const frame=function(ts){
    if(t0===null)t0=ts;
    if(demoPlay){
      el.__t=((ts-t0)%CYCLE)/CYCLE;
      drawFrame(el,id,el.__t);
    } else if(t0!==null){ t0=ts-(el.__t||0)*CYCLE; }
    el.__raf=requestAnimationFrame(frame);
  };
  el.__t=0;
  drawFrame(el,id,0);
  el.__raf=requestAnimationFrame(frame);
}
/* Pause / step are shared by the sheet and the full-screen view, so the controls
   behave identically wherever the demonstration appears. */
function demoToggle(){
  const el=stageEl();if(!el||!el.__id)return;
  demoPlay=!demoPlay;
  const pb=document.getElementById('demo-play');
  if(pb)pb.textContent=demoPlay?'PAUSE':'PLAY';
}
function demoStep(){
  const el=stageEl();if(!el||!el.__id)return;
  demoPlay=false;
  const pb=document.getElementById('demo-play');if(pb)pb.textContent='PLAY';
  el.__t=((el.__t||0)+1/16)%1;
  drawFrame(el,el.__id,el.__t);
}

/* ================= THE 48 DEMONSTRATIONS =================
   Every entry is authored the same way, in the same order, so the table itself is
   auditable:

     label   the movement, for the screen reader and the full-screen header
     view    'side' or 'front' — decides only how shoulders and hips separate
     scene   which apparatus kit to draw
     load    what is carried, and loadAt where it is carried
     ph      [away-verb, home-verb] — the two actions the HUD alternates between
     pole    which way the elbows and knees bend (a property of the exercise)
     home    the SHORTENED-muscle position
     away    the LENGTHENED-muscle position
     toe     which way the foot points (overridable per pose — a calf raise
             keeps the ball of the foot on the step while the heel travels)

   A pose only names what a coach names: pelvis position, spine direction, head
   direction, and where the hands and feet are. Elbows and knees are solved, never
   guessed. Coordinates are in the shared 200x200 canvas, floor at y=182, and every
   hand is within 43.5 units of its shoulder and every foot within 62.8 of its hip
   — the skeleton's real reach, asserted by _audit_demos.cjs.
*/

/* ================= CHARTS ================= */
function svgBars(items,h){
  h=h||175;const W=560,P=38,B=26,cw=(W-P-8)/items.length;
  const mx=Math.max(...items.map(i=>i.v),1);
  const avg=items.reduce((a,i)=>a+i.v,0)/items.length;
  const ay=h-B-Math.min(1,avg/mx)*(h-B-18);
  let s='<svg viewBox="0 0 '+W+' '+h+'" class="chart" role="img" aria-label="Weekly training volume, last '+items.length+' weeks. Average '+comp(avg)+' '+wl()+' a week.">';
  s+='<line class="gridl" x1="'+P+'" y1="'+ay.toFixed(1)+'" x2="'+(W-6)+'" y2="'+ay.toFixed(1)+'" stroke-dasharray="4 5"/>';
  items.forEach((it,k)=>{
    const bh=Math.max(2,it.v/mx*(h-B-18)),x=P+k*cw+cw*0.18,bwid=cw*0.64,y=h-B-bh;
    s+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bwid.toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="5" class="'+(it.cur?'bar-cur':'bar')+'"/>';
    if(it.v)s+='<text class="'+(it.cur?'barv-cur':'barv')+'" x="'+(x+bwid/2).toFixed(1)+'" y="'+(y-5).toFixed(1)+'" text-anchor="middle">'+comp(it.v)+'</text>';
    s+='<text class="axl" x="'+(x+bwid/2).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle">'+it.l+'</text>';
  });
  /* The average is annotated in the LEFT GUTTER — the same strip svgLine puts its
     axis labels in, and the one place on this chart that no bar, and no week's own
     value label, can ever reach. It used to be an axis label written at the far
     right BEFORE the bars were drawn, so the current week's bar painted straight
     across the middle of the words ("AV…kg") — the one thing on this chart that
     cannot be reconstructed from the pixels that survive. */
  s+='<text class="avgk" x="'+(P-4).toFixed(1)+'" y="'+(ay-2).toFixed(1)+'" text-anchor="end">AVG</text>';
  s+='<text class="avgv" x="'+(P-4).toFixed(1)+'" y="'+(ay+10).toFixed(1)+'" text-anchor="end">'+comp(avg)+'</text>';
  return s+'</svg>';
}
function svgLine(seq,proj,h){
  h=h||200;const W=560,pl=44,pr=12,pt=14,pb=24,iw=W-pl-pr,ih=h-pt-pb;
  const all=seq.concat(proj||[]);

function svgSpark(vals,w,hh){
